  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tch: 100%;\n  font-display: swap;\n  src: url(\"a8be4fa7-b889-4c49-88a1-d6de39343aba\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"27980507-2bbb-4428-8325-5954a0df8a95\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"ca1f3b45-acc4-43e2-acad-8711859721b5\"><\u002Fscript>\n\n<style>\n/* ── Tokens ─────────────────────────────────────────────────────────────── */\n:root{\n  --bg0:#0f1117;--bg1:#181c26;--bg2:#1e2333;--bg3:#252b3b;--bg4:#2d3448;\n  --bdr:rgba(255,255,255,0.07);--bdr2:rgba(255,255,255,0.13);\n  --t1:#e8eaf2;--t2:#8b92a8;--t3:#4f566b;\n  --acc:#4f8ef7;--acc-h:#6ba3ff;--acc-s:rgba(79,142,247,0.13);\n  --ai:#8b5cf6;--ai-s:rgba(139,92,246,0.13);\n  --ok:#34d399;--warn:#fbbf24;--err:#f87171;\n  --paper:#fff;--paper-sh:rgba(0,0,0,0.55);\n  --rsm:4px;--r:6px;--rlg:10px;\n  --fui:'IBM Plex Sans',system-ui,sans-serif;--fmono:'IBM Plex Mono',monospace;\n}\n[data-theme=\"light\"]{\n  --bg0:#f0f2f8;--bg1:#fff;--bg2:#eaecf5;--bg3:#e0e3f0;--bg4:#d4d8ea;\n  --bdr:rgba(46,52,80,0.1);--bdr2:rgba(46,52,80,0.18);\n  --t1:#181c2e;--t2:#4a526e;--t3:#8b92a8;\n  --paper-sh:rgba(0,0,0,0.11);\n}\n\n/* ── Reset ───────────────────────────────────────────────────────────────── */\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%;overflow:hidden}\nbody{font-family:var(--fui);background:var(--bg0);color:var(--t1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}\nbutton{cursor:pointer;font-family:var(--fui)}\nsvg{display:block;pointer-events:none}\n\n/* ── Shell ───────────────────────────────────────────────────────────────── */\n.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}\n\n/* ── TopNav ─ 48px ───────────────────────────────────────────────────────── */\n.topnav{\n  height:48px;min-height:48px;flex-shrink:0;\n  background:var(--bg1);border-bottom:1px solid var(--bdr);\n  display:flex;align-items:center;padding:0 14px 0 12px;gap:6px;\n  z-index:100;\n}\n.logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:6px}\n.logo-mark{\n  width:30px;height:30px;border-radius:8px;background:var(--acc);\n  display:flex;align-items:center;justify-content:center;flex-shrink:0\n}\n.logo-mark svg{width:16px;height:16px;color:#fff}\n.logo-word{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.4px}\n.logo-word em{color:var(--acc);font-style:normal}\n\n.file-chip{\n  display:flex;align-items:center;gap:7px;padding:5px 10px;\n  background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);\n  cursor:default;max-width:230px;transition:background .12s;\n}\n.file-chip:hover{background:var(--bg3)}\n.file-name{font-size:12.5px;font-weight:450;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.dirty-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}\n\n.nav-sp{flex:1}\n\n.cmd-pill{\n  display:flex;align-items:center;gap:10px;padding:5px 12px;\n  background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);\n  cursor:pointer;transition:all .12s;user-select:none;\n}\n.cmd-pill:hover{background:var(--bg3);border-color:var(--acc)}\n.cmd-pill-txt{font-size:12px;color:var(--t3)}\n.cmd-kbds{display:flex;gap:2px;align-items:center}\n.kbd{\n  font-size:10px;font-family:var(--fmono);padding:1px 5px;\n  background:var(--bg3);border:1px solid var(--bdr2);border-radius:3px;color:var(--t3)\n}\n\n.save-badge{\n  display:flex;align-items:center;gap:5px;font-size:11px;font-family:var(--fmono);\n  padding:3px 8px;border-radius:20px;transition:all .2s;\n}\n.save-badge.saved{color:var(--ok);background:rgba(52,211,153,.1)}\n.save-badge.dirty{color:var(--warn);background:rgba(251,191,36,.1)}\n.save-dot{width:5px;height:5px;border-radius:50%;background:currentColor}\n\n.nav-btn{\n  width:32px;height:32px;border-radius:var(--r);\n  display:flex;align-items:center;justify-content:center;\n  border:none;background:none;color:var(--t3);transition:all .12s;\n}\n.nav-btn:hover{background:var(--bg3);color:var(--t2)}\n.nav-btn svg{width:16px;height:16px}\n\n.avatar{\n  width:28px;height:28px;border-radius:50%;background:var(--acc);\n  display:flex;align-items:center;justify-content:center;\n  font-size:11px;font-weight:600;color:#fff;cursor:pointer;flex-shrink:0;\n}\n\n/* ── ModeBar ─ 40px ─ THE KEY INNOVATION ────────────────────────────────── */\n.modebar{\n  height:40px;min-height:40px;flex-shrink:0;\n  background:var(--bg2);border-bottom:1px solid var(--bdr);\n  display:flex;align-items:center;padding:0 12px;gap:4px;z-index:90;\n}\n.mode-group{\n  display:flex;align-items:center;gap:1px;\n  background:var(--bg1);border:1px solid var(--bdr);\n  border-radius:var(--rlg);padding:3px;\n}\n.mode-tab{\n  display:flex;align-items:center;gap:6px;padding:4px 11px;\n  border-radius:7px;border:none;background:none;\n  color:var(--t2);font-size:12px;font-weight:500;font-family:var(--fui);\n  cursor:pointer;transition:all .12s;white-space:nowrap;user-select:none;\n}\n.mode-tab:hover{color:var(--t1);background:var(--bg2)}\n.mode-tab.active{background:var(--bg3);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.25)}\n.mode-tab.ai.active{color:var(--ai)}\n.mode-tab svg{width:13px;height:13px;flex-shrink:0}\n\n.mb-sp{flex:1}\n.mb-right{display:flex;align-items:center;gap:2px}\n.mb-sep{width:1px;height:16px;background:var(--bdr);margin:0 5px}\n\n.mb-btn{\n  display:flex;align-items:center;gap:4px;height:27px;padding:0 7px;\n  border-radius:var(--rsm);border:none;background:none;\n  color:var(--t3);font-size:11px;font-family:var(--fui);cursor:pointer;transition:all .12s;\n}\n.mb-btn:hover{background:var(--bg3);color:var(--t2)}\n.mb-btn:disabled{opacity:.3;cursor:default;pointer-events:none}\n.mb-btn svg{width:13px;height:13px}\n\n.zoom-chip{\n  display:flex;align-items:center;gap:3px;height:27px;padding:0 8px;\n  border-radius:var(--rsm);border:none;background:none;\n  font-size:11px;font-family:var(--fmono);color:var(--t2);cursor:pointer;transition:all .12s;\n}\n.zoom-chip:hover{background:var(--bg3);color:var(--t1)}\n.zoom-chip svg{width:11px;height:11px;opacity:.6}\n\n/* ── Context Toolbar ─ 34px ─────────────────────────────────────────────── */\n.ctxbar{\n  height:34px;min-height:34px;flex-shrink:0;\n  background:var(--bg1);border-bottom:1px solid var(--bdr);\n  display:flex;align-items:center;padding:0 12px;gap:1px;\n  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;\n}\n.ctxbar::-webkit-scrollbar{display:none}\n.ctxbar-content{display:none;align-items:center;gap:1px}\n.ctxbar-content.active{display:flex}\n\n.ctx-label{\n  font-size:9.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;\n  color:var(--t3);white-space:nowrap;padding:0 5px 0 9px;flex-shrink:0;user-select:none;\n}\n.ctx-label:first-child{padding-left:2px}\n\n.ctx-btn{\n  display:flex;align-items:center;gap:5px;height:24px;padding:0 7px;\n  border-radius:var(--rsm);border:none;background:none;\n  color:var(--t2);font-size:11.5px;font-family:var(--fui);\n  white-space:nowrap;cursor:pointer;transition:all .1s;flex-shrink:0;\n}\n.ctx-btn:hover{background:var(--bg2);color:var(--t1)}\n.ctx-btn.active{background:var(--acc-s);color:var(--acc)}\n.ctx-btn.danger:hover{background:rgba(248,113,113,.12);color:var(--err)}\n.ctx-btn.ai.active{background:var(--ai-s);color:var(--ai)}\n.ctx-btn svg{width:13px;height:13px;flex-shrink:0}\n\n.ctx-sep{width:1px;height:16px;background:var(--bdr);margin:0 4px;flex-shrink:0}\n\n/* ── Main ────────────────────────────────────────────────────────────────── */\n.main{display:flex;flex:1;overflow:hidden}\n\n/* ── Left Rail ─ 48px ───────────────────────────────────────────────────── */\n.rail{\n  width:48px;background:var(--bg1);border-right:1px solid var(--bdr);\n  display:flex;flex-direction:column;align-items:center;\n  padding:8px 0;gap:2px;flex-shrink:0;z-index:80;\n}\n.rail-btn{\n  position:relative;width:34px;height:34px;border-radius:var(--r);\n  display:flex;align-items:center;justify-content:center;\n  border:none;background:none;color:var(--t3);cursor:pointer;transition:all .15s;\n}\n.rail-btn:hover{background:var(--bg2);color:var(--t2)}\n.rail-btn.active{background:var(--acc-s);color:var(--acc)}\n.rail-btn::before{\n  content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);\n  width:3px;height:0;background:var(--acc);border-radius:0 2px 2px 0;transition:height .18s;\n}\n.rail-btn.active::before{height:18px}\n.rail-btn svg{width:17px;height:17px}\n.rail-sp{flex:1}\n.rtip{\n  position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);\n  background:var(--bg4);border:1px solid var(--bdr2);border-radius:var(--rsm);\n  padding:4px 9px;font-size:11px;color:var(--t1);white-space:nowrap;\n  pointer-events:none;opacity:0;transition:opacity .12s;z-index:200;\n}\n.rail-btn:hover .rtip{opacity:1}\n\n/* ── Sidebar ─ 210px ─────────────────────────────────────────────────────── */\n.sidebar{\n  width:210px;background:var(--bg1);border-right:1px solid var(--bdr);\n  display:flex;flex-direction:column;flex-shrink:0;\n}\n.sb-hd{\n  height:36px;display:flex;align-items:center;justify-content:space-between;\n  padding:0 12px;border-bottom:1px solid var(--bdr);flex-shrink:0;\n}\n.sb-ttl{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--t3)}\n.sb-act{\n  width:22px;height:22px;border-radius:var(--rsm);\n  display:flex;align-items:center;justify-content:center;\n  border:none;background:none;color:var(--t3);cursor:pointer;transition:all .12s;\n}\n.sb-act:hover{background:var(--bg2);color:var(--t2)}\n.sb-act svg{width:13px;height:13px}\n.sb-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}\n.sb-body::-webkit-scrollbar{width:4px}\n.sb-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}\n\n.thumb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n.thumb{\n  border-radius:5px;display:flex;flex-direction:column;align-items:center;\n  padding:5px 5px 4px;cursor:pointer;border:1.5px solid transparent;\n  transition:all .13s;background:var(--bg2);\n}\n.thumb:hover{border-color:var(--bdr2)}\n.thumb.active{border-color:var(--acc);background:var(--acc-s)}\n.thumb-page{\n  width:100%;aspect-ratio:0.707;background:var(--paper);border-radius:2px;\n  overflow:hidden;padding:5px 4px;display:flex;flex-direction:column;gap:1.5px;\n}\n.tl{height:1.5px;background:#e0e0e0;border-radius:1px;width:100%}\n.tl.h{height:3px;background:#c8c8c8;width:55%}\n.tl.s{width:62%}.tl.m{width:80%}.tl.f{width:100%}\n.tl.gap{margin-top:3px}\n.thumb-num{font-size:9px;font-family:var(--fmono);color:var(--t3);margin-top:3px}\n.thumb.active .thumb-num{color:var(--acc)}\n\n/* ── Workspace ───────────────────────────────────────────────────────────── */\n.workspace{\n  flex:1;background:var(--bg0);\n  display:flex;flex-direction:column;align-items:center;\n  overflow-y:auto;overflow-x:hidden;padding:24px 20px;gap:20px;position:relative;\n}\n.workspace::-webkit-scrollbar{width:6px}\n.workspace::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}\n\n.pdf-page{\n  background:var(--paper);width:100%;max-width:600px;\n  border-radius:3px;box-shadow:0 2px 28px var(--paper-sh);\n  position:relative;overflow:hidden;flex-shrink:0;\n}\n.pdf-inner{padding:44px 56px}\n.pl{height:8px;background:#e4e6ec;border-radius:2px;margin-bottom:7px}\n.pl.h{height:15px;background:#c4c6d0;width:52%;margin-bottom:20px}\n.pl.h2{height:11px;background:#d0d2da;width:40%;margin-top -row\">\n          <span class=\"pk\">Color<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px\">\n            <span class=\"cdot\" style=\"background:#4f8ef7\"><\u002Fspan>\n            <span class=\"pv\">#4f8ef7<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">Opacity<\u002Fspan><span class=\"pv\">80%<\u002Fspan><\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">Author<\u002Fspan><span class=\"pv\">JD<\u002Fspan><\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">Locked<\u002Fspan><span class=\"pv\">No<\u002Fspan><\u002Fdiv>\n\n        <div class=\"prop-sec\">Position<\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">X<\u002Fspan><span class=\"pv\">56px<\u002Fspan><\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">Y<\u002Fspan><span class=\"pv\">105px<\u002Fspan><\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">W<\u002Fspan><span class=\"pv\">280px<\u002Fspan><\u002Fdiv>\n        <div class=\"prop-row\"><span class=\"pk\">H<\u002Fspan><span class=\"pv\">32px<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n  <\u002Fdiv><!-- /main -->\n\n  <!-- Status Bar -->\n  <div class=\"statusbar\">\n    <div class=\"st-item\"><span>PDF Hub<\u002Fspan><\u002Fdiv>\n    <div class=\"st-sep\"><\u002Fdiv>\n    <div class=\"st-item\"><span>14 pages<\u002Fspan><\u002Fdiv>\n    <div class=\"st-sep\"><\u002Fdiv>\n    <div class=\"st-item\">\n      <span>Page<\u002Fspan>\n      <input id=\"page-input\" type=\"text\" value=\"2\" style=\"width:32px;text-align:center;font-size:11px;font-family:var(--fmono);padding:1px 4px;background:var(--bg2);border:1px solid var(--bdr);border-radius:3px;color:var(--t1);outline:none\">\n      <span>/ <span class=\"stv\">14<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"st-sep\"><\u002Fdiv>\n    <div class=\"st-item\"><span class=\"stv\" id=\"st-mode\">Annotate<\u002Fspan><\u002Fdiv>\n    <div class=\"st-sp\"><\u002Fdiv>\n    <div class=\"st-item\" style=\"gap:6px\">\n      <span class=\"stv\" id=\"zoom-val\">100%<\u002Fspan>\n      <input type=\"range\" class=\"zoom-sl\" id=\"zoom-slider\" min=\"25\" max=\"400\" step=\"25\" value=\"100\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /app -->\n\n<!-- ── Command Palette Overlay ──────────────────────────────────────────── -->\n<div class=\"cmd-overlay\" id=\"cmd-overlay\">\n  <div class=\"cmd-palette\">\n    <div class=\"cmd-inp-wrap\">\n      <i data-lucide=\"search\"><\u002Fi>\n      <input class=\"cmd-inp\" id=\"cmd-inp\" placeholder=\"Search or run a command…\" autocomplete=\"off\">\n      <span class=\"kbd\" style=\"font-size:10px\">Esc<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"cmd-results\">\n      <div class=\"cmd-sec\">Recent<\u002Fdiv>\n      <div class=\"cmd-item hi\">\n        <div class=\"cmd-ico\"><i data-lucide=\"folder-open\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Open PDF…<\u002Fspan>\n        <span class=\"cmd-ikbd\">⌘O<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\"><i data-lucide=\"save\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Save<\u002Fspan>\n        <span class=\"cmd-ikbd\">⌘S<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-sec\">Annotate<\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\" style=\"background:rgba(251,191,36,.15);color:var(--warn)\"><i data-lucide=\"highlighter\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Highlight selection<\u002Fspan>\n        <span class=\"cmd-ikbd\">H<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\"><i data-lucide=\"message-square\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Add sticky note<\u002Fspan>\n        <span class=\"cmd-ikbd\">N<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\"><i data-lucide=\"stamp\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Apply stamp<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-sec\">Generate<\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\" style=\"background:var(--ai-s);color:var(--ai)\"><i data-lucide=\"sparkles\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Run macro recipe…<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\" style=\"background:var(--ai-s);color:var(--ai)\"><i data-lucide=\"wand-2\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Open Macro Builder<\u002Fspan>\n        <span class=\"cmd-ikbd\">⌘M<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-sec\">View<\u002Fdiv>\n      <div class=\"cmd-item\">\n        <div class=\"cmd-ico\"><i data-lucide=\"moon\"><\u002Fi><\u002Fdiv>\n        <span class=\"cmd-iname\">Toggle dark mode<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── Tweaks Panel ─────────────────────────────────────────────────────── -->\n<div class=\"tweaks-panel\" id=\"tweaks-panel\">\n  <div class=\"tw-hd\">\n    <span class=\"tw-ttl\">Tweaks<\u002Fspan>\n    <button class=\"tw-close\" id=\"tw-close\"><i data-lucide=\"x\"><\u002Fi><\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tw-body\">\n    <div class=\"tw-row\">\n      <span class=\"tw-lbl\">Theme<\u002Fspan>\n      <select class=\"tw-sel\" id=\"tw-theme\">\n        <option value=\"dark\">Dark<\u002Foption>\n        <option value=\"light\">Light<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"tw-divider\"><\u002Fdiv>\n    <div class=\"tw-row\">\n      <span class=\"tw-lbl\">Show document<\u002Fspan>\n      <button class=\"tw-tog on\" id=\"tw-doc\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"tw-row\">\n      <span class=\"tw-lbl\">Show inspector<\u002Fspan>\n      <button class=\"tw-tog on\" id=\"tw-insp\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"tw-row\">\n      <span class=\"tw-lbl\">Show sidebar<\u002Fspan>\n      <button class=\"tw-tog on\" id=\"tw-sidebar\"><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"tw-divider\"><\u002Fdiv>\n    <div class=\"tw-row\">\n      <span class=\"tw-lbl\">Active mode<\u002Fspan>\n      <select class=\"tw-sel\" id=\"tw-mode\">\n        <option value=\"view\">View<\u002Foption>\n        <option value=\"annotate\" selected=\"\">Annotate<\u002Foption>\n        <option value=\"draw\">Draw<\u002Foption>\n        <option value=\"write\">Write<\u002Foption>\n        <option value=\"organize\">Organize<\u002Foption>\n        <option value=\"generate\">Generate<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"tw-divider\"><\u002Fdiv>\n    <div class=\"tw-note\">Explore the contextual toolbar — each mode shows only its relevant tools, dramatically reducing clutter.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\"theme\":\"dark\",\"showDocument\":true,\"showInspector\":true,\"showSidebar\":true,\"activeMode\":\"annotate\"}/*EDITMODE-END*/;\n\n// ── Boot ────────────────────────────────────────────────────────────────────\ndocument.addEventListener('DOMContentLoaded', () => {\n  lucide.createIcons();\n  initTweaks();\n  initModeTabs();\n  initRailBtns();\n  initThemeToggle();\n  initCommandPalette();\n  initZoom();\n  initSave();\n  applyTweakDefaults();\n});\n\n// ── Mode Tabs ───────────────────────────────────────────────────────────────\nfunction initModeTabs() {\n  document.querySelectorAll('.mode-tab').forEach(tab => {\n    tab.addEventListener('click', () => setMode(tab.dataset.mode));\n  });\n  document.querySelectorAll('.ctx-btn').forEach(btn => {\n    btn.addEventListener('click', function() {\n      if (this.classList.contains('danger')) return;\n      const siblings = this.closest('.ctxbar-content').querySelectorAll('.ctx-btn');\n      if (this.classList.contains('active')) { this.classList.remove('active'); return; }\n      // Allow multi-active within group sections\n      this.classList.toggle('active');\n    });\n  });\n}\n\nfunction setMode(mode) {\n  // Update tabs\n  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));\n  // Update context toolbars\n  document.querySelectorAll('.ctxbar-content').forEach(c => {\n    c.classList.toggle('active', c.dataset.ctx === mode);\n  });\n  // Update status bar\n  const labels = { view:'View', annotate:'Annotate', draw:'Draw', write:'Write', organize:'Organize', generate:'Generate' };\n  document.getElementById('st-mode').textContent = labels[mode] || mode;\n  // Update tweaks select\n  const twMode = document.getElementById('tw-mode');\n  if (twMode) twMode.value = mode;\n}\n\n// ── Left Rail Panels ────────────────────────────────────────────────────────\nfunction initRailBtns() {\n  const panels = { thumbnails:'Pages', search:'Search', comments:'Comments', macros:'Macros', bookmarks:'Bookmarks', help:'Help' };\n  document.querySelectorAll('.rail-btn[data-panel]').forEach(btn => {\n    btn.addEventListener('click', () => {\n      const panel = btn.dataset.panel;\n      document.querySelectorAll('.rail-btn[data-panel]').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      // Show the right sidebar panel\n      ['thumbnails','search','comments','macros','bookmarks'].forEach(p => {\n        const el = document.getElementById('panel-' + p);\n        if (el) el.style.display = (p === panel) ? '' : 'none';\n      });\n      document.getElementById('sb-title').textContent = panels[panel] || panel;\n    });\n  });\n  // Thumbnail click\n  document.querySelectorAll('.thumb').forEach(th => {\n    th.addEventListener('click', () => {\n      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));\n      th.classList.add('active');\n      const pg = th.dataset.pg;\n      document.getElementById('page-input').value = pg;\n      // Highlight active page\n      document.querySelectorAll('.pdf-page').forEach(p => p.style.outline = '');\n      const activePg = document.querySelector(`.pdf-page[data-page=\"${pg}\"]`);\n      if (activePg) activePg.style.outline = '2px solid var(--acc)';\n    });\n  });\n}\n\n// ── Theme ───────────────────────────────────────────────────────────────────\nfunction initThemeToggle() {\n  const btn = document.getElementById('theme-btn');\n  btn.addEventListener('click', () => toggleTheme());\n}\nfunction toggleTheme() {\n  const html = document.documentElement;\n  const isDark = html.dataset.theme === 'dark';\n  html.dataset.theme = isDark ? 'light' : 'dark';\n  lucide.createIcons();\n  document.getElementById('tw-theme').value = isDark ? 'light' : 'dark';\n}\nfunction setTheme(t) {\n  document.documentElement.dataset.theme = t;\n  lucide.createIcons();\n}\n\n// ── Command Palette ──────────────────────────────────────────────────────────\nfunction initCommandPalette() {\n  const overlay = document.getElementById('cmd-overlay');\n  document.getElementById('cmd-trigger').addEventListener('click', () => openCmd());\n  overlay.addEventListener('click', e => { if (e.target === overlay) closeCmd(); });\n  document.addEventListener('keydown', e => {\n    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmd(); }\n    if (e.key === 'Escape') closeCmd();\n  });\n  document.querySelectorAll('.cmd-item').forEach(item => {\n    item.addEventListener('click', closeCmd);\n  });\n}\nfunction openCmd() {\n  document.getElementById('cmd-overlay').classList.add('open');\n  setTimeout(() => document.getElementById('cmd-inp').focus(), 50);\n}\nfunction closeCmd() {\n  document.getElementById('cmd-overlay').classList.remove('open');\n  document.getElementById('cmd-inp').value = '';\n}\n\n// ── Zoom ─────────────────────────────────────────────────────────────────────\nfunction initZoom() {\n  const slider = document.getElementById('zoom-slider');\n  const display = document.getElementById('zoom-display');\n  const stVal = document.getElementById('zoom-val');\n  const zoomSteps = [25, 50, 75, 100, 125, 150, 200, 300, 400];\n\n  function updateZoom(val) {\n    display.textContent = val + '%';\n    stVal.textContent = val + '%';\n    slider.value = val;\n  }\n  slider.addEventListener('input', () => updateZoom(Number(slider.value)));\n  document.getElementById('zoom-in-btn').addEventListener('click', () => {\n    const cur = Number(slider.value);\n    const next = zoomSteps.find(s => s > cur) || 400;\n    updateZoom(next);\n  });\n  document.getElementById('zoom-out-btn').addEventListener('click', () => {\n    const cur = Number(slider.value);\n    const prev = [...zoomSteps].reverse().find(s => s < cur) || 25;\n    updateZoom(prev);\n  });\n}\n\n// ── Save status animation ────────────────────────────────────────────────────\nfunction initSave() {\n  setTimeout(() => {\n    const badge = document.getElementById('save-badge');\n    const label = document.getElementById('save-label');\n    badge.className = 'save-badge saved';\n    label.textContent = 'Saved';\n  }, 2400);\n}\n\n// ── Tweaks ───────────────────────────────────────────────────────────────────\nfunction initTweaks() {\n  // Protocol: register listener before posting availability\n  window.addEventListener('message', e => {\n    if (e.data?.type === '__activate_edit_mode') openTweaks();\n    if (e.data?.type === '__deactivate_edit_mode') closeTweaks();\n  });\n  window.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\n  document.getElementById('tw-close').addEventListener('click', () => {\n    closeTweaks();\n    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');\n  });\n\n  // Controls\n  document.getElementById('tw-theme').addEventListener('change', e => {\n    setTheme(e.target.value);\n    persist({ theme: e.target.value });\n  });\n  document.getElementById('tw-doc').addEventListener('click', function() {\n    this.classList.toggle('on');\n    const on = this.classList.contains('on');\n    document.getElementById('doc-pages').style.display = on ? '' : 'none';\n    document.getElementById('empty-zone').style.display = on ? 'none' : 'flex';\n    persist({ showDocument: on });\n  });\n  document.getElementById('tw-insp').addEventListener('click', function() {\n    this.classList.toggle('on');\n    const on = this.classList.contains('on');\n    document.querySelector('.inspector').style.display = on ? '' : 'none';\n    persist({ showInspector: on });\n  });\n  document.getElementById('tw-sidebar').addEventListener('click', function() {\n    this.classList.toggle('on');\n    const on = this.classList.contains('on');\n    document.getElementById('sidebar').style.display = on ? '' : 'none';\n    persist({ showSidebar: on });\n  });\n  document.getElementById('tw-mode').addEventListener('change', e => {\n    setMode(e.target.value);\n    persist({ activeMode: e.target.value });\n  });\n}\n\nfunction openTweaks() { document.getElementById('tweaks-panel').classList.add('open'); }\nfunction closeTweaks() { document.getElementById('tweaks-panel').classList.remove('open'); }\nfunction persist(edits) {\n  window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');\n}\n\nfunction applyTweakDefaults() {\n  const d = TWEAK_DEFAULTS;\n  setTheme(d.theme);\n  document.getElementById('tw-theme').value = d.theme;\n  if (!d.showDocument) {\n    document.getElementById('doc-pages').style.display = 'none';\n    document.getElementById('empty-zone').style.display = 'flex';\n    document.getElementById('tw-doc').classList.remove('on');\n  }\n  if (!d.showInspector) {\n    document.querySelector('.inspector').style.display = 'none';\n    document.getElementById('tw-insp').classList.remove('on');\n  }\n  if (!d.showSidebar) {\n    document.getElementById('sidebar').style.display = 'none';\n    document.getElementById('tw-sidebar').classList.remove('on');\n  }\n  if (d.activeMode && d.activeMode !== 'annotate') setMode(d.activeMode);\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
