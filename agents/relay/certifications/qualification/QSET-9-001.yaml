      "payload": {
        "source": "Issue #286 + pre-Phase9 page-only rebuild contract",
        "values": {
          "page_count": {
            "value": 10,
            "units": "pages"
          },
          "page_only_rebuild": {
            "value": true,
            "units": "boolean"
          },
          "catalog_structures": {
            "value": [
              "nested outline",
              "PageLabels",
              "AcroForm field/widget",
              "native annotation",
              "embedded attachment"
            ],
            "units": "structures"
          },
