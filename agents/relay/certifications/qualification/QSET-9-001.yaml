      "prompt": "Design an independent verification for Phase 9 fidelity. It must compare fixture-declared semantic inventories before and after the full two-cycle mutation/save/reopen sequence, use PDF.js/reopen rendering only as an independent consumer rather than the sole oracle, and separately verify signed/encrypted explicitness. Predict the expected result and state exactness/tolerance.",
