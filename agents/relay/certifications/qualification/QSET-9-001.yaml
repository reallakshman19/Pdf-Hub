      "focus": "BOUNDARIES_INVARIANTS",
      "anchors": [
        "WP-009",
        "AC-03",
        "AC-04"
      ],
      "prompt": "State the consequence if a proposed fidelity fix makes the output render successfully but silently drops a fixture-declared outline/form/attachment/tagged structure, or reports a content-mutated signed PDF as still cryptographically valid. Name the protected invariant and the exact observation that falsifies a safe implementation.",
      "mutation": {
        "condition": "Accept renderability as sufficient fidelity, silently drop a protected semantic structure during mutation, or present a content-mutated signed document as retaining valid signature state.",
        "protected_invariant": "Supported mutations preserve fixture-declared semantic structures across repeated save/reopen cycles or explicitly classify transformation/invalidation/rejection; cryptographic validity is never implied after unsupported/content-changing mutation.",
        "falsifier": "A required semantic structure is absent/unreachable after first or second reopen while the operation claims success, or a mutated signed PDF is presented as signature-valid without independent proof."
      },
      "required_output_keys": [
        "mutation_effect",
        "protected_invariant",
        "falsifier"
      ],
      "evidence_required": true
    },
