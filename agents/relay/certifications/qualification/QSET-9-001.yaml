    {
      "id": "Q2",
      "focus": "ENGINEERING_PROBLEM",
      "anchors": [
        "WP-009",
        "INPUT-03",
        "AC-02"
      ],
      "prompt": "Reconstruct the fidelity failure logically from the supplied fixture model without relying on implementation comments. A 10-page PDF has a nested outline destination to page 5, PageLabels, one populated AcroForm field/widget, one native annotation and one embedded attachment. A reorder implementation creates a new PDFDocument and copies only pages in the requested order. Derive which semantic structures are at risk even if all 10 pages still render, and predict what the repeated save/reopen oracle must detect.",
