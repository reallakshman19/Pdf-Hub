      ],
      "prompt": "Trace the canonical structural-mutation production path Phase 9 will harden. Identify the command/session entrypoint, the mutation-session state owner, the authority for page identity/order and immutable revision publication, and the downstream save/reopen consumer used to detect document-level fidelity loss. Explain where page-only rebuild/copy behavior can omit catalog structures.",
