name: agent-apply-pdfjs-lease-migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/pdfjs-document-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply lease migration
        run: python scripts/agent_patch_pdfjs_leases.py
      - name: Commit migration
        run: |
          git config user.name 'pdf-hub-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate long-lived PDF.js consumers to leases'
          git push origin HEAD:${{ github.head_ref }}
