name: agent-publish-tested-cancellation

on:
  push:
    branches:
      - agent/pdf-operation-cancellation

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-operation-cancellation
          fetch-depth: 0
      - name: Download tested source artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-pdf-cancellation-tested-source
          path: /tmp/cancellation-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30101261255
      - name: Verify and extract tested source
        run: |
          cat > /tmp/expected-files.txt <<'EOF'
          docs/PDF_OPERATION_CANCELLATION.md
          frontend/src/adapters/pdf-edit/PdfEditAdapter.ts
          frontend/src/core/cancellation/operationCancellation.test.ts
          frontend/src/core/cancellation/operationCancellation.ts
          frontend/src/core/macro/batchRunner.ts
          frontend/src/core/macro/cancellation.test.ts
          frontend/src/core/macro/executor.ts
          frontend/src/core/macro/headlessApi.ts
          frontend/src/core/macro/registry.ts
          frontend/src/core/macro/resourceBudget.ts
          frontend/src/core/macro/sessionRunner.ts
          frontend/src/core/macro/steps/conditional-ops.ts
          frontend/src/core/macro/steps/content-ops.ts
          frontend/src/core/macro/steps/document-ops.ts
          frontend/src/core/macro/steps/page-ops.ts
          EOF
          tar -tzf /tmp/cancellation-artifact/cancellation-source.tar.gz \
            | grep -v -E '^(cancellation-files.txt|pnpm-lock.yaml|scripts/agent_apply_pdf_cancellation.py)$' \
            | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          tar -xzf /tmp/cancellation-artifact/cancellation-source.tar.gz -C .
          rm -f cancellation-files.txt pnpm-lock.yaml scripts/agent_apply_pdf_cancellation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        run: cd frontend && pnpm exec tsc --noEmit
      - name: Focused cancellation tests
        run: >-
          cd frontend && pnpm exec vitest run
          src/core/cancellation/operationCancellation.test.ts
          src/core/macro/cancellation.test.ts
          src/core/macro/resourceBudget.test.ts
          src/core/macro/sessionRunner.test.ts
          src/adapters/pdf-edit/PdfEditAdapter.test.ts
          --pool=forks
      - name: Commit tested source
        run: |
          rm -f .github/workflows/agent-publish-tested-cancellation.yml pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs frontend .github/workflows
          git commit -m "Add cooperative macro PDF cancellation"
          git push origin HEAD:agent/pdf-operation-cancellation
