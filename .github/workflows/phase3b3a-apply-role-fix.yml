name: Apply Phase 3B.3A role typing fix

on:
  push:
    branches:
      - agent/static-project-member-admission-phase3b3a

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-project-member-admission-phase3b3a
          fetch-depth: 0

      - name: Apply role-status overloads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/core/admission/zip/writerProjectMemberAdmission.ts')
          text = path.read_text()
          replacements = [
              (
                  "roleStatus<WriterProjectRequiredRootFile>(records, role)",
                  "roleStatus(records, role)",
              ),
              (
                  "roleStatus<WriterProjectOptionalRootFile>(records, role)",
                  "roleStatus(records, role)",
              ),
              (
                  """function roleStatus<T extends string>(
  records: readonly WriterProjectMemberAdmissionRecord[],
  role: T,
): T extends WriterProjectRequiredRootFile
  ? WriterProjectRequiredRoleStatus
  : WriterProjectOptionalRoleStatus {
  const record = records.find(
    (candidate) =>
      candidate.role === role && candidate.admissionOutcome === 'ADMITTED',
  );
  return {
    role,
    present: Boolean(record),
    ...(record ? { ordinal: record.ordinal } : {}),
  } as T extends WriterProjectRequiredRootFile
    ? WriterProjectRequiredRoleStatus
    : WriterProjectOptionalRoleStatus;
}
""",
                  """function roleStatus(
  records: readonly WriterProjectMemberAdmissionRecord[],
  role: WriterProjectRequiredRootFile,
): WriterProjectRequiredRoleStatus;
function roleStatus(
  records: readonly WriterProjectMemberAdmissionRecord[],
  role: WriterProjectOptionalRootFile,
): WriterProjectOptionalRoleStatus;
function roleStatus(
  records: readonly WriterProjectMemberAdmissionRecord[],
  role: WriterProjectRequiredRootFile | WriterProjectOptionalRootFile,
): WriterProjectRequiredRoleStatus | WriterProjectOptionalRoleStatus {
  const record = records.find(
    (candidate) =>
      candidate.role === role && candidate.admissionOutcome === 'ADMITTED',
  );
  return {
    role,
    present: Boolean(record),
    ...(record ? { ordinal: record.ordinal } : {}),
  };
}
""",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one role typing marker, found {count}.')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/phase3b3a-apply-role-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/core/admission/zip/writerProjectMemberAdmission.ts .github/workflows/phase3b3a-apply-role-fix.yml
          git commit -m 'Fix Phase 3B.3A role evidence typing'
          git push origin HEAD:agent/static-project-member-admission-phase3b3a
