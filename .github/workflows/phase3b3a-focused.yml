name: Phase 3B.3A focused validation

on:
  push:
    branches:
      - agent/static-project-member-admission-phase3b3a
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase3b3a-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-project-member-admission-phase3b3a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Capture strict TypeScript diagnostics
        working-directory: frontend
        run: |
          set +e
          mkdir -p ../artifacts
          pnpm run typecheck > ../artifacts/phase3b3a-typecheck.txt 2>&1
          status=$?
          cat ../artifacts/phase3b3a-typecheck.txt
          exit "$status"

      - name: Upload TypeScript diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b3a-typecheck-diagnostic
          path: artifacts/phase3b3a-typecheck.txt
          if-no-files-found: error
