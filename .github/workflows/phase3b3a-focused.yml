name: Phase 3B.3A focused validation

on:
  push:
    branches:
      - agent/static-project-member-admission-phase3b3a
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase3b3a-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-diagnostic:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-project-member-admission-phase3b3a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Capture focused test diagnostics
        working-directory: frontend
        run: |
          set +e
          mkdir -p ../artifacts
          pnpm exec vitest run \
            src/core/admission/zip/writerProjectMemberProfile.test.ts \
            src/core/admission/zip/writerProjectMemberAdmission.test.ts \
            src/core/admission/zip/writerProjectMemberCompatibility.test.ts \
            src/core/writer-v2/export/projectImportMemberAdmission.test.ts \
            src/core/writer-v2/export/projectImportResourceAdmission.test.ts \
            src/core/writer-v2/export/projectImportController.source.test.ts \
            src/core/writer-v2/export/projectZip.test.ts \
            src/core/ocr/__tests__/ocrProjectCodec.test.ts \
            --pool=forks --maxWorkers=1 \
            > ../artifacts/phase3b3a-focused.txt 2>&1
          status=$?
          cat ../artifacts/phase3b3a-focused.txt
          exit "$status"

      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b3a-focused-diagnostic
          path: artifacts/phase3b3a-focused.txt
          if-no-files-found: error
