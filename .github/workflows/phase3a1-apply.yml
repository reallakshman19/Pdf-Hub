name: Apply Phase 3A.1 production patch
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - name: Patch production lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('frontend/src/core/writer-v2/export/projectImportController.ts')
          text = controller_path.read_text()
          text = text.replace(
              '  consumed: boolean;\n  revoked: boolean;\n}',
              '  consumed: boolean;\n  revoked: boolean;\n  detachAbort: (() => void) | null;\n}',
              1,
          )
          text = text.replace(
              '''  stagedRegistry.set(capability, {
    project: reconciled,
    operationId: operation.operationId,
    generation: operation.generation,
    operation,
    consumed: false,
    revoked: false,
  });
  return capability;''',
              '''  const registered: RegisteredStage = {
    project: reconciled,
    operationId: operation.operationId,
    generation: operation.generation,
    operation,
    consumed: false,
    revoked: false,
    detachAbort: null,
  };
  stagedRegistry.set(capability, registered);
  bindStageAbort(registered);
  try {
    assertOperationCurrent(operation, 'standalone Writer project after staging registration');
  } catch (error) {
    releaseRegisteredStage(registered);
    throw error;
  }
  return capability;''',
              1,
          )
          text = text.replace(
              '  registered.revoked = true;\n  registered.project = null;',
              '  releaseRegisteredStage(registered);',
              1,
          )
          text = text.replace(
              '''  } finally {
    registered.revoked = true;
    registered.project = null;
  }
}''',
              '''  } finally {
    releaseRegisteredStage(registered);
  }
}''',
              1,
          )
          if 'function bindStageAbort(' not in text:
              marker = 'function assertUsableStage(\n'
              helpers = '''function bindStageAbort(registered: RegisteredStage): void {
  const signal = registered.operation.signal;
  if (!signal) return;
  const revoke = () => releaseRegisteredStage(registered);
  if (signal.aborted) {
    revoke();
    return;
  }
  signal.addEventListener('abort', revoke, { once: true });
  registered.detachAbort = () => signal.removeEventListener('abort', revoke);
}

function releaseRegisteredStage(registered: RegisteredStage): void {
  registered.detachAbort?.();
  registered.detachAbort = null;
  registered.revoked = true;
  registered.project = null;
}

'''
              text = text.replace(marker, helpers + marker, 1)
          required = [
              'detachAbort: (() => void) | null;',
              'const registered: RegisteredStage = {',
              'bindStageAbort(registered);',
              'function releaseRegisteredStage(',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Controller patch incomplete: {missing}')
          controller_path.write_text(text)

          toolbar_path = Path('frontend/src/components/writer-v2/WriterV2ToolbarControls.tsx')
          toolbar = toolbar_path.read_text()
          if 'Superseded by an editable PDF project import.' not in toolbar:
              toolbar = toolbar.replace(
                  '    if (isPdf) {\n      try {',
                  "    if (isPdf) {\n      const previous = standaloneImportRef.current;\n      previous?.controller.abort('Superseded by an editable PDF project import.');\n      if (previous?.staged) revokeStagedWriterProjectImport(previous.staged);\n      standaloneImportRef.current = null;\n      try {",
                  1,
              )
          if 'Superseded by an editable PDF project import.' not in toolbar:
              raise SystemExit('Round-trip supersession patch incomplete')
          toolbar_path.write_text(toolbar)

          toolbar_test_path = Path('frontend/src/components/writer-v2/WriterV2ToolbarControls.test.tsx')
          toolbar_test = toolbar_test_path.read_text()
          toolbar_test = toolbar_test.replace(
              '  importProjectIntoWriterStore: vi.fn(),\n  importRoundTripPdfIntoWriterStore: vi.fn(),',
              '  stageStandaloneWriterProject: vi.fn(),\n  commitStagedWriterProjectImport: vi.fn(),\n  revokeStagedWriterProjectImport: vi.fn(),\n  importRoundTripPdfIntoWriterStore: vi.fn(),',
              1,
          )
          if 'stageStandaloneWriterProject: vi.fn(),' not in toolbar_test:
              raise SystemExit('Toolbar test mock patch incomplete')
          toolbar_test_path.write_text(toolbar_test)
          PY
      - name: Commit production patch and remove workflow
        run: |
          rm .github/workflows/phase3a1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 3A.1 production lifecycle hardening"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
