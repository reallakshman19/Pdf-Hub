name: Phase 3A.1 apply semantic patch
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          set -euo pipefail
          cat frontend/scripts/phase3a1-patch/patch0{0,1,2,3,4,5}.b64 | base64 -d > /tmp/phase3a1-patch.py
          python -m py_compile /tmp/phase3a1-patch.py
          python /tmp/phase3a1-patch.py
          rm -rf frontend/scripts/phase3a1-patch .github/phase3a1 .github/workflows/phase3a1-apply.yml
      - name: Commit semantic completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 3A.1 semantic validation boundaries"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
