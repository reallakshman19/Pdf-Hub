name: Phase 2A PR bootstrap

on:
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/donor-pdf-admission-phase2a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-pdf-admission-phase2a
          fetch-depth: 0

      - name: Extract committed bootstrap patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase2a-core-bootstrap.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit core enforcement"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          obsolete = "replace_exact(\n    'frontend/src/components/workspace/DocumentWorkspace.test.tsx',"
          if obsolete in script:
              script = script[:script.index(obsolete)]
          Path('/tmp/phase2a-core-patch.py').write_text(script, encoding='utf-8')
          PY

      - name: Run committed bootstrap patch
        id: patch
        shell: bash
        run: |
          set +e
          python /tmp/phase2a-core-patch.py > phase2a-bootstrap.log 2>&1
          status=$?
          cat phase2a-bootstrap.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-bootstrap-diagnostics
          path: phase2a-bootstrap.log
          if-no-files-found: error

      - name: Commit core enforcement and remove bootstrap workflows
        if: steps.patch.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "OpenAI Implementation Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2a-core-bootstrap.yml
          git rm .github/workflows/phase2a-pr-bootstrap.yml
          git add frontend
          git commit -m "Enforce admitted donors at command boundary"
          git push origin HEAD:agent/donor-pdf-admission-phase2a

      - name: Propagate bootstrap failure
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
