name: agent-typecheck-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/pdfjs-document-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fix digest input typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/adapters/pdf-renderer/PdfRendererAdapter.ts')
          text = path.read_text(encoding='utf-8')
          old = "function digestHex(bytes: Uint8Array): Promise<string> {\n  const digestInput = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);"
          new = "function digestHex(bytes: Uint8Array<ArrayBuffer>): Promise<string> {\n  const digestInput = Uint8Array.from(bytes).buffer;"
          if text.count(old) != 1:
              raise SystemExit('Unexpected digest helper shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/agent-typecheck-diagnostics.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'pdf-hub-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PDF.js cache digest typing'
          git push origin HEAD:${{ github.head_ref }}
