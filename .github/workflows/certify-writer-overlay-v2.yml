name: certify-writer-overlay-v2

on:
  push:
  pull_request:

jobs:
  certify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate

      - run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          set -o pipefail
          cd frontend
          pnpm run typecheck 2>&1 | tee ../typecheck-diagnostic.log

      - name: Upload typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck-diagnostic.log
          if-no-files-found: error

      - name: Portable Vitest suite
        run: cd frontend && pnpm exec vitest run --exclude src/core/macro/psIsonote/rca.test.ts

      - name: Writer Overlay V2 certification
        run: cd frontend && pnpm run certify:writer-overlay-v2

      - name: Writer Overlay V2 final certification
        run: cd frontend && pnpm run certify:writer-overlay-v2-final

      - name: Build
        run: cd frontend && pnpm run build
