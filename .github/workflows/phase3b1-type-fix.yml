name: Phase 3B.1 byte helper type fix
on:
  push:
    branches:
      - agent/raw-zip-structural-admission-phase3b1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-zip-structural-admission-phase3b1
          fetch-depth: 0
      - name: Widen raw filename byte helper type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/core/admission/zip/zipInventory.ts')
          text = path.read_text()
          old = 'function rawFilenameKey(bytes: readonly number[]): string {'
          new = 'function rawFilenameKey(bytes: ArrayLike<number>): string {'
          if old not in text:
              raise SystemExit('rawFilenameKey target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase3b1-typecheck-diagnostics.yml
          rm .github/workflows/phase3b1-type-fix.yml
      - name: Commit type correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 3B.1 raw filename byte typing"
          git push origin HEAD:agent/raw-zip-structural-admission-phase3b1
