name: Frontend Certify

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: corepack enable
        working-directory: .

      - run: corepack prepare pnpm@10.23.0 --activate
        working-directory: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Phase 8 static audit
        run: pnpm run audit:phase8

      - name: Build
        run: pnpm run build

      - name: E2E smoke tests
        working-directory: .
        run: |
          set -euo pipefail

          if [ ! -d tests ]; then
            echo "Smoke tests skipped: tests/ workspace is not present in this repository."
            exit 0
          fi

          if [ ! -f tests/package.json ]; then
            echo "Smoke tests skipped: tests/package.json is not present."
            exit 0
          fi

          pnpm -C tests install --frozen-lockfile
          pnpm -C tests test
