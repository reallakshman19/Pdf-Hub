name: agent-apply-html-sanitizer-lint-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/html-sanitization-macro-budgets'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace control-character regexes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/core/writer/htmlSanitizer.ts')
          text = path.read_text(encoding='utf-8-sig')
          replacements = [
            (
              "  const compactPrefix = trimmed.slice(0, 64).replace(/[\\u0000-\\u0020\\u007f]+/g, '').toLowerCase();",
              "  const compactPrefix = stripAsciiControlsAndWhitespace(trimmed.slice(0, 64)).toLowerCase();",
            ),
            (
              "  if (value.length > 1_024 || /[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]/.test(value)) {",
              "  if (value.length > 1_024 || containsDisallowedControlCharacter(value)) {",
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'Unexpected sanitizer marker count: {old}')
            text = text.replace(old, new)

          helper_marker = "function escapeHtml(value: string): string {"
          helpers = """function stripAsciiControlsAndWhitespace(value: string): string {
            let result = '';
            for (const character of value) {
              const code = character.charCodeAt(0);
              if (code > 32 && code != 127) result += character;
            }
            return result;
          }

          function containsDisallowedControlCharacter(value: string): boolean {
            for (const character of value) {
              const code = character.charCodeAt(0);
              if ((code >= 0 && code <= 8) || code === 11 || code === 12 || (code >= 14 && code <= 31) || code === 127) {
                return true;
              }
            }
            return false;
          }

          """
          if text.count(helper_marker) != 1:
            raise SystemExit('Unexpected escapeHtml marker count')
          text = text.replace(helper_marker, helpers + helper_marker)
          path.write_text(text, encoding='utf-8')

          for workflow in [
            '.github/workflows/agent-lint-diagnostics-html-macro.yml',
            '.github/workflows/agent-apply-html-sanitizer-lint-fix.yml',
          ]:
            candidate = Path(workflow)
            if candidate.exists(): candidate.unlink()
          PY
      - name: Commit lint fix
        run: |
          git config user.name 'pdf-hub-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Replace sanitizer control regexes'
          git push origin HEAD:${{ github.head_ref }}
