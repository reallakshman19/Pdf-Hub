name: Guards

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  guards:
    name: Anti-drift guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Scope diagnostics
        continue-on-error: true
        run: |
          active_task="$(node -e "const fs=require('fs'); const state=JSON.parse(fs.readFileSync('tasks/STATE.json','utf8')); process.stdout.write(state.activeTask ?? '')")"
          if [ -z "$active_task" ]; then
            echo "No active task card; scope guard is not applicable."
            exit 0
          fi
          node scripts/guard-scope.mjs origin/${{ github.base_ref }}

      - name: Forbidden-regression diagnostics
        continue-on-error: true
        run: node scripts/guard-forbidden.mjs

      - name: Ratchet diagnostics
        continue-on-error: true
        run: node scripts/guard-ratchet.mjs
