name: agent-apply-optional-abort-args

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/pdf-operation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-operation-cancellation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply optional abort argument compatibility fix
        run: python scripts/agent_fix_optional_abort_args.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        run: cd frontend && pnpm exec tsc --noEmit
      - name: Previously failing macro tests
        run: >-
          cd frontend && pnpm exec vitest run
          src/core/macro/executor.test.ts
          src/core/macro/slice5-runtime.test.ts
          src/core/macro/steps/page-ops.slice2.test.ts
          src/core/macro/cancellation.test.ts
          --pool=forks
      - name: Complete Vitest suite
        run: cd frontend && pnpm run test
      - name: Commit tested compatibility fix
        run: |
          git checkout -- frontend/pnpm-lock.yaml
          rm -f scripts/agent_fix_optional_abort_args.py
          rm -f .github/workflows/agent-apply-optional-abort-args.yml
          rm -f .github/workflows/agent-full-test-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/core/macro/steps/page-ops.ts frontend/src/core/macro/steps/document-ops.ts .github/workflows scripts
          git commit -m "Preserve PDF edit calls when cancellation is unused"
          git push origin HEAD:agent/pdf-operation-cancellation
