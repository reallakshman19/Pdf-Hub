name: Frontend CI

on:
  pull_request:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable pnpm
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Mojibake audit
        working-directory: frontend
        run: pnpm run audit:no-mojibake

      - name: Portable test suite
        working-directory: frontend
        run: pnpm exec vitest run --pool=forks --maxWorkers=1 --exclude src/core/macro/psIsonote/rca.test.ts

      - name: Doc Hub certification
        working-directory: frontend
        run: pnpm run check:doc-hub

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Baseline lint diagnostics
        continue-on-error: true
        working-directory: frontend
        run: pnpm run lint

      - name: Baseline static diagnostics
        continue-on-error: true
        working-directory: frontend
        run: pnpm run check:static

      - name: Upload Doc Hub certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-hub-certification
          path: frontend/artifacts/*.json
          if-no-files-found: warn

  e2e-tests:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable pnpm
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
