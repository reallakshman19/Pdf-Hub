name: Phase 3B.2 closure cleanup

on:
  push:
    branches:
      - agent/bounded-zip-extraction-phase3b2

permissions:
  contents: write

concurrency:
  group: phase3b2-closure-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-zip-extraction-phase3b2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: corepack prepare pnpm@10.23.0 --activate

      - name: Synchronize frontend lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Remove temporary closure material
        run: |
          rm -f frontend/scripts/capture-phase3b2-typecheck.mjs
          rm -f .github/workflows/phase3b2-closure-cleanup.yml

      - name: Verify bounded cleanup diff
        run: |
          set -euo pipefail
          git diff --exit-code -- frontend/package.json
          test ! -e frontend/scripts/capture-phase3b2-typecheck.mjs
          test ! -e .github/workflows/phase3b2-closure-cleanup.yml
          git diff -- pnpm-lock.yaml

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml frontend/scripts/capture-phase3b2-typecheck.mjs .github/workflows/phase3b2-closure-cleanup.yml
          git commit -m 'Finalize Phase 3B.2 cleanup'
          git push origin HEAD:agent/bounded-zip-extraction-phase3b2
