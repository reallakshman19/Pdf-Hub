name: Phase 3B.1 lint correction
on:
  push:
    branches:
      - agent/raw-zip-structural-admission-phase3b1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-zip-structural-admission-phase3b1
          fetch-depth: 0
      - name: Replace control regex with code-point mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/core/admission/zip/zipInventory.ts')
          text = path.read_text()
          old = """function displayUnsafeName(value: string): string {
            return value.replace(/[\\u0000-\\u001f\\u007f]/g, (character) => {
              const code = character.codePointAt(0) ?? 0;
              return `<U+${code.toString(16).toUpperCase().padStart(4, '0')}>`;
            });
          }
          """
          new = """function displayUnsafeName(value: string): string {
            return Array.from(value, (character) => {
              const code = character.codePointAt(0) ?? 0;
              if (code !== 0 && code >= 0x20 && code !== 0x7f) return character;
              return `<U+${code.toString(16).toUpperCase().padStart(4, '0')}>`;
            }).join('');
          }
          """
          if old not in text:
              raise SystemExit('displayUnsafeName target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase3b1-lint-diagnostics.yml
          rm .github/workflows/phase3b1-lint-fix.yml
      - name: Commit lint correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 3B.1 diagnostic escaping lint"
          git push origin HEAD:agent/raw-zip-structural-admission-phase3b1
