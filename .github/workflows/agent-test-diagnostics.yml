name: agent-test-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/pdfjs-document-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Mark cache promise handled
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/adapters/pdf-renderer/PdfRendererAdapter.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    entry.docPromise = task.promise
      .then((doc) => {
        entry.doc = doc;
        return doc;
      })
      .catch((loadError) => {
        if (this.documentCache.get(key) === entry) {
          this.documentCache.delete(key);
        }
        throw loadError;
      });
    this.documentCache.set(key, entry);'''
          new = '''    entry.docPromise = task.promise
      .then((doc) => {
        entry.doc = doc;
        return doc;
      })
      .catch((loadError) => {
        if (this.documentCache.get(key) === entry) {
          this.documentCache.delete(key);
        }
        throw loadError;
      });
    void entry.docPromise.catch(() => undefined);
    this.documentCache.set(key, entry);'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected cache promise shape')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/agent-test-diagnostics.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'pdf-hub-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Handle rejected PDF.js cache promises'
          git push origin HEAD:${{ github.head_ref }}
