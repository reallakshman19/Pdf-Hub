name: agent-cancellation-boundaries-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/pdf-operation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct literal regex replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('scripts/agent_apply_cancellation_boundaries.py')
          text = target.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('replacement helper anchor not found')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply remaining cancellation boundaries
        run: |
          set -o pipefail
          python scripts/agent_apply_cancellation_boundaries.py 2>&1 | tee boundary-patch.log
      - name: Serialize Tesseract worker termination
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          target = Path('frontend/src/core/ocr/engines/tesseractJsEngine.ts')
          text = target.read_text(encoding='utf-8')
          pattern = re.compile(r"      const workerPromise = workerFactory\(language\);.*?      \} finally \{\n        await terminateOnce\(\);\n      \}", re.S)
          replacement = '\n'.join([
              '      let activeWorker: TesseractWorkerLike | null = null;',
              '      let terminationPromise: Promise<void> | null = null;',
              '      const terminateOnce = (workerOverride?: TesseractWorkerLike) => {',
              '        const targetWorker = workerOverride ?? activeWorker;',
              '        if (!targetWorker) return Promise.resolve();',
              '        terminationPromise ??= targetWorker.terminate().catch(() => undefined);',
              '        return terminationPromise;',
              '      };',
              '',
              '      const workerPromise = workerFactory(language).then((createdWorker) => {',
              '        activeWorker = createdWorker;',
              '        return createdWorker;',
              '      });',
              '      const worker = await raceWithAbort(',
              '        workerPromise,',
              '        signal,',
              "        'start Tesseract worker',",
              '        () => {',
              '          void workerPromise',
              '            .then((lateWorker) => terminateOnce(lateWorker))',
              '            .catch(() => undefined);',
              '        },',
              '      );',
              '',
              '      try {',
              '        const recognitionPromise = worker.recognize(image);',
              '        const result = await raceWithAbort(',
              '          recognitionPromise,',
              '          signal,',
              "          'run Tesseract recognition',",
              '          () => { void terminateOnce(); },',
              '        );',
              '        return result.data;',
              '      } finally {',
              '        await terminateOnce();',
              '      }',
          ])
          updated, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Tesseract termination block matches: {count}')
          target.write_text(updated, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        run: |
          set -o pipefail
          cd frontend
          pnpm exec tsc --noEmit 2>&1 | tee ../boundary-typecheck.log
      - name: Focused cancellation tests
        run: |
          set +e
          cd frontend
          set -o pipefail
          pnpm exec vitest run \
            src/adapters/pdf-renderer/PdfRendererAdapter.test.ts \
            src/core/ocr/__tests__/tesseractJsEngine.test.ts \
            src/core/cancellation/operationCancellation.test.ts \
            src/core/macro/cancellation.test.ts \
            src/core/macro/resourceBudget.test.ts \
            src/core/macro/sessionRunner.test.ts \
            src/adapters/pdf-edit/PdfEditAdapter.test.ts \
            --pool=forks 2>&1 | tee ../boundary-tests.log
          status=${PIPESTATUS[0]}
          cd ..
          if [ "$status" -ne 0 ]; then touch boundary-tests.failed; fi
          exit 0
      - name: Package tested source
        run: |
          test ! -f boundary-tests.failed
          cat > boundary-files.txt <<'EOF'
          docs/PDF_OPERATION_CANCELLATION.md
          frontend/src/adapters/pdf-renderer/PdfRendererAdapter.test.ts
          frontend/src/adapters/pdf-renderer/PdfRendererAdapter.ts
          frontend/src/components/sidebar/MacrosSidebar.tsx
          frontend/src/components/sidebar/SearchPanel.tsx
          frontend/src/components/sidebar/panels/ThumbnailSidebar.tsx
          frontend/src/core/ocr/__tests__/tesseractJsEngine.test.ts
          frontend/src/core/ocr/engines/ocrEngineContract.ts
          frontend/src/core/ocr/engines/tesseractJsEngine.ts
          frontend/src/core/renderer/usePageRenderer.ts
          EOF
          tar -czf cancellation-boundaries-source.tar.gz -T boundary-files.txt
      - name: Upload tested source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cancellation-boundaries-tested-source
          path: |
            boundary-patch.log
            boundary-typecheck.log
            boundary-tests.log
            boundary-tests.failed
            boundary-files.txt
            cancellation-boundaries-source.tar.gz
          if-no-files-found: ignore
