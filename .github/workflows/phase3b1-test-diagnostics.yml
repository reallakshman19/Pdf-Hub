name: Phase 3B.1 focused test diagnostics
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture focused Phase 3B.1 tests
        run: |
          set +e
          cd frontend
          pnpm exec vitest run \
            src/core/admission/zip/zipInventory.test.ts \
            src/core/admission/zip/zipAdmission.test.ts \
            src/core/writer-v2/export/projectImportStructuralAdmission.test.ts \
            src/core/writer-v2/export/projectImportController.test.ts \
            src/core/writer-v2/export/projectImportController.source.test.ts \
            > ../phase3b1-tests.log 2>&1
          status=$?
          cat ../phase3b1-tests.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b1-tests
          path: phase3b1-tests.log
