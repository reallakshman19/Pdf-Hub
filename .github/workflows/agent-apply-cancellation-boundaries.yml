name: agent-apply-cancellation-boundaries

on:
  push:
    branches:
      - agent/pdf-operation-cancellation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-operation-cancellation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct literal regex replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('scripts/agent_apply_cancellation_boundaries.py')
          text = target.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('replacement helper anchor not found')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply remaining cancellation boundaries
        run: python scripts/agent_apply_cancellation_boundaries.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        run: cd frontend && pnpm exec tsc --noEmit
      - name: Focused cancellation tests
        run: >-
          cd frontend && pnpm exec vitest run
          src/adapters/pdf-renderer/PdfRendererAdapter.test.ts
          src/core/ocr/__tests__/tesseractJsEngine.test.ts
          src/core/cancellation/operationCancellation.test.ts
          src/core/macro/cancellation.test.ts
          src/core/macro/resourceBudget.test.ts
          src/core/macro/sessionRunner.test.ts
          src/adapters/pdf-edit/PdfEditAdapter.test.ts
          --pool=forks
      - name: Commit remaining cancellation boundaries
        run: |
          rm -f \
            scripts/agent_apply_cancellation_boundaries.py \
            .github/workflows/agent-apply-cancellation-boundaries.yml \
            .github/workflows/agent-cancellation-boundaries-diagnostics.yml \
            frontend/pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs frontend .github/workflows scripts
          git commit -m "Cancel PDF.js rendering OCR and macro UI work"
          git push origin HEAD:agent/pdf-operation-cancellation
