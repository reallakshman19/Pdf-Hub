name: Phase 3A.1 focused test fixes
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Phase 3A.1 focused fixtures') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - name: Fix deterministic fixtures and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/core/writer-v2/export/projectImportController.test.ts')
          text = path.read_text()
          replacements = [
            (
              "import { createBlankWriterDocumentMeta } from '../writerDocumentMode';",
              "import {\n  createBlankWriterDocumentMeta,\n  createPdfOverlayWriterDocumentMeta,\n} from '../writerDocumentMode';",
            ),
            (
              "async function zeroPagePdfBytes(): Promise<Uint8Array> {\n  const document = await PDFDocument.create();\n  return document.save();\n}\n\n",
              "",
            ),
            (
              "  useWriterV2Store.getState().hydrateWriterSession({\n    documentFingerprint: 'old-doc',\n    elements: [],\n    persistedAt: '2026-01-01T00:00:00.000Z',\n  });",
              "  useWriterV2Store.getState().hydrateWriterSession({\n    documentFingerprint: 'old-doc',\n    elements: [],\n    persistedAt: '2026-01-01T00:00:00.000Z',\n    documentMeta: createPdfOverlayWriterDocumentMeta({\n      documentFingerprint: 'old-doc',\n      pageCount: 3,\n      now: '2026-01-01T00:00:00.000Z',\n    }),\n  });",
            ),
            (
              "    const zeroPagePdf = await projectFile({\n      originalPdfBytes: await zeroPagePdfBytes(),\n      documentFingerprint: 'doc-1',\n      elements: [],\n      assets: [],\n    });\n\n",
              "",
            ),
            (
              "    await expect(stageStandaloneWriterProject(zeroPagePdf, operation())).rejects.toThrow(\n      'invalid page count',\n    );",
              "    vi.spyOn(PDFDocument, 'load').mockResolvedValueOnce({\n      getPageCount: () => 0,\n    } as unknown as PDFDocument);\n    await expect(\n      stageStandaloneWriterProject(await overlayFile(), operation()),\n    ).rejects.toThrow('invalid page count');",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'test fixture target not found: {old[:60]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/phase3a1-focused.txt .github/workflows/phase3a1-focused-diagnostics.yml
      - name: Commit focused fixture fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 3A.1 focused fixtures"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
