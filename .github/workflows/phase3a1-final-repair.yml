name: Phase 3A.1 final repair
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Apply final Phase 3A.1 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          controller = 'frontend/src/core/writer-v2/export/projectImportController.ts'
          toolbar = 'frontend/src/components/writer-v2/WriterV2ToolbarControls.tsx'
          toolbar_test = 'frontend/src/components/writer-v2/WriterV2ToolbarControls.test.tsx'
          source_test = 'frontend/src/core/writer-v2/export/projectImportController.source.test.ts'
          controller_test = 'frontend/src/core/writer-v2/export/projectImportController.test.ts'

          replace_once(
              toolbar_test,
              """vi.mock('@/core/writer-v2/export/projectImportController', () => ({
            importProjectIntoWriterStore: vi.fn(),
            importRoundTripPdfIntoWriterStore: vi.fn(),
          }));""",
              """vi.mock('@/core/writer-v2/export/projectImportController', () => ({
            stageStandaloneWriterProject: vi.fn(),
            commitStagedWriterProjectImport: vi.fn(),
            revokeStagedWriterProjectImport: vi.fn(),
            importRoundTripPdfIntoWriterStore: vi.fn(),
          }));""",
          )

          replace_once(
              controller,
              """  consumed: boolean;
            revoked: boolean;
          }""",
              """  consumed: boolean;
            revoked: boolean;
            detachAbort: (() => void) | null;
          }""",
          )

          replace_once(
              controller,
              """  stagedRegistry.set(capability, {
            project: reconciled,
            operationId: operation.operationId,
            generation: operation.generation,
            operation,
            consumed: false,
            revoked: false,
          });
          return capability;""",
              """  const registered: RegisteredStage = {
            project: reconciled,
            operationId: operation.operationId,
            generation: operation.generation,
            operation,
            consumed: false,
            revoked: false,
            detachAbort: null,
          };
          stagedRegistry.set(capability, registered);
          bindStageAbort(registered);
          try {
            assertOperationCurrent(operation, 'standalone Writer project after staging registration');
          } catch (error) {
            releaseRegisteredStage(registered);
            throw error;
          }
          return capability;""",
          )

          replace_once(
              controller,
              """  registered.revoked = true;
            registered.project = null;""",
              """  releaseRegisteredStage(registered);""",
          )

          replace_once(
              controller,
              """  } finally {
            registered.revoked = true;
            registered.project = null;
          }
          }

          /**""",
              """  } finally {
            releaseRegisteredStage(registered);
          }
          }

          /**""",
          )

          replace_once(
              controller,
              """function assertUsableStage(
            stage: StagedWriterProjectImport,""",
              """function bindStageAbort(registered: RegisteredStage): void {
            const signal = registered.operation.signal;
            if (!signal) return;
            const revoke = () => releaseRegisteredStage(registered);
            if (signal.aborted) {
              revoke();
              return;
            }
            signal.addEventListener('abort', revoke, { once: true });
            registered.detachAbort = () => signal.removeEventListener('abort', revoke);
          }

          function releaseRegisteredStage(registered: RegisteredStage): void {
            registered.detachAbort?.();
            registered.detachAbort = null;
            registered.revoked = true;
            registered.project = null;
          }

          function assertUsableStage(
            stage: StagedWriterProjectImport,""",
          )

          replace_once(
              toolbar,
              """    if (isPdf) {
              try {
                // Editable round-trip PDF (Option C) remains a separate compatibility path.""",
              """    if (isPdf) {
              const previous = standaloneImportRef.current;
              previous?.controller.abort('Superseded by an editable PDF project import.');
              if (previous?.staged) revokeStagedWriterProjectImport(previous.staged);
              standaloneImportRef.current = null;
              try {
                // Editable round-trip PDF (Option C) remains a separate compatibility path.""",
          )

          replace_once(
              source_test,
              """    const standaloneRoute = route.slice(route.indexOf('const previous'));

            expect(standaloneRoute).toContain('stageStandaloneWriterProject');""",
              """    const pdfRoute = route.slice(
              route.indexOf('if (isPdf)'),
              route.indexOf('const generation ='),
            );
            const standaloneRoute = route.slice(route.indexOf('const generation ='));

            expect(pdfRoute).toContain('controller.abort');
            expect(pdfRoute).toContain('revokeStagedWriterProjectImport');
            expect(pdfRoute.indexOf('controller.abort')).toBeLessThan(
              pdfRoute.indexOf('importRoundTripPdfIntoWriterStore'),
            );
            expect(standaloneRoute).toContain('stageStandaloneWriterProject');""",
          )

          replace_once(
              controller_test,
              """import { useOcrStore } from '@/core/ocr/ocrStore';
          import {""",
              """import { useOcrStore } from '@/core/ocr/ocrStore';
          import { createOcrProjectPayload } from '@/core/ocr/ocrProjectCodec';
          import {""",
          )

          replace_once(
              controller_test,
              """async function zeroPagePdfBytes(): Promise<Uint8Array> {
            const document = await PDFDocument.create();
            return document.save();
          }

          """,
              """""",
          )

          replace_once(
              controller_test,
              """async function blankProjectFile(): Promise<File> {""",
              """async function overlayFileWithOcr(): Promise<File> {
            return projectFile({
              originalPdfBytes: await onePagePdfBytes(),
              documentFingerprint: 'doc-1',
              elements: [element('writer-1')],
              assets: [asset()],
              ocrProject: createOcrProjectPayload({ documentFingerprint: 'doc-1' }),
              updatedAt: '2026-01-02T00:00:00.000Z',
            });
          }

          async function blankProjectFile(): Promise<File> {""",
          )

          replace_once(
              controller_test,
              """  it('commits a blank Writer project by clearing the previous PDF atomically', async () => {""",
              """  it('carries a supported OCR payload without hydrating the OCR store', async () => {
            seedExistingState();
            const beforeOcr = useOcrStore.getState();
            const activeOperation = operation();
            const staged = await stageStandaloneWriterProject(
              await overlayFileWithOcr(),
              activeOperation,
            );

            await commitStagedWriterProjectImport(staged, activeOperation);

            expect(useSessionStore.getState().documentKey).toBe('doc-1');
            expect(useWriterV2Store.getState().currentDocumentFingerprint).toBe('doc-1');
            expect(useOcrStore.getState()).toEqual(beforeOcr);
          });

          it('commits a blank Writer project by clearing the previous PDF atomically', async () => {""",
          )

          replace_once(
              controller_test,
              """    seedExistingState();
            const staged = await stageStandaloneWriterProject(await overlayFile(), operation(3));""",
              """    expect(stateSnapshot()).toEqual(before);

            seedExistingState();
            const beforeIdentityChecks = stateSnapshot();
            const staged = await stageStandaloneWriterProject(await overlayFile(), operation(3));""",
          )

          replace_once(
              controller_test,
              """    expect(stateSnapshot()).toEqual(before);
            });

            it('rejects invalid metadata, signatures, and malformed ZIPs without state mutation'""",
              """    expect(stateSnapshot()).toEqual(beforeIdentityChecks);
            });

            it('revokes a staged capability when its operation aborts after staging', async () => {
              seedExistingState();
              const before = stateSnapshot();
              const controller = new AbortController();
              const activeOperation = operation(1, true, controller.signal);
              const staged = await stageStandaloneWriterProject(await overlayFile(), activeOperation);

              controller.abort('abandon staged project');

              await expect(commitStagedWriterProjectImport(staged, activeOperation)).rejects.toThrow(
                'revoked',
              );
              expect(stateSnapshot()).toEqual(before);
            });

            it('rejects superseded and unmounted capabilities before mutation', async () => {
              seedExistingState();
              const before = stateSnapshot();
              let current = true;
              let mounted = true;
              const activeOperation: StandaloneWriterProjectOperation = {
                operationId: 'dynamic-operation',
                generation: 9,
                isCurrent: () => current,
                isMounted: () => mounted,
              };
              const superseded = await stageStandaloneWriterProject(
                await overlayFile(),
                activeOperation,
              );
              current = false;
              await expect(
                commitStagedWriterProjectImport(superseded, activeOperation),
              ).rejects.toThrow('superseded');
              revokeStagedWriterProjectImport(superseded);

              current = true;
              const unmounted = await stageStandaloneWriterProject(
                await overlayFile(),
                activeOperation,
              );
              mounted = false;
              await expect(
                commitStagedWriterProjectImport(unmounted, activeOperation),
              ).rejects.toThrow('no longer mounted');
              revokeStagedWriterProjectImport(unmounted);

              expect(stateSnapshot()).toEqual(before);
            });

            it('rejects invalid metadata, signatures, and malformed ZIPs without state mutation'""",
          )

          replace_once(
              controller_test,
              """    const zeroPagePdf = await projectFile({
              originalPdfBytes: await zeroPagePdfBytes(),
              documentFingerprint: 'doc-1',
              elements: [],
              assets: [],
            });

          """,
              """""",
          )

          replace_once(
              controller_test,
              """    await expect(stageStandaloneWriterProject(zeroPagePdf, operation())).rejects.toThrow(
              'invalid page count',
            );""",
              """    const parsedWithoutPages = await PDFDocument.create();
            vi.spyOn(parsedWithoutPages, 'getPageCount').mockReturnValue(0);
            vi.spyOn(PDFDocument, 'load').mockResolvedValueOnce(parsedWithoutPages);
            await expect(
              stageStandaloneWriterProject(await overlayFile(), operation()),
            ).rejects.toThrow('invalid page count');""",
          )
          PY
      - name: Verify final Phase 3A.1 repair
        run: |
          cd frontend
          pnpm run typecheck
          pnpm run lint
          pnpm exec vitest run \
            src/core/writer-v2/export/projectImportController.test.ts \
            src/core/writer-v2/export/projectImportController.source.test.ts \
            src/components/writer-v2/WriterV2ToolbarControls.test.tsx \
            --pool=forks --maxWorkers=1
          pnpm run test:ci
      - name: Commit final repair and remove temporary files
        run: |
          rm -f .github/workflows/phase3a1-final-repair.yml
          rm -f .github/workflows/phase3a1-focused-diagnostics.yml
          rm -f .github/phase3a1-focused.txt
          rm -f .github/phase3a1-fix-trigger
          rm -f .github/workflows/phase3a1-bootstrap.yml
          rm -f .github/workflows/phase3a1-fix.yml
          rm -f .github/workflows/phase3a1-typecheck-diagnostics.yml
          rm -f phase3a1-focused.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 3A.1 import lifecycle tests"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
