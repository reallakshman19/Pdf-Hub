name: Phase 3A.1 final lifecycle repair
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Phase 3A.1 lifecycle repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Apply lifecycle repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'{label} target not found')
              file.write_text(text.replace(old, new, 1))

          controller = Path('frontend/src/core/writer-v2/export/projectImportController.ts')
          text = controller.read_text()
          text = text.replace(
              '  revoked: boolean;\n}',
              '  revoked: boolean;\n  detachAbort: (() => void) | null;\n}',
              1,
          )
          pattern = re.compile(
              r"  stagedRegistry\.set\(capability, \{\n"
              r"    project: reconciled,\n"
              r"    operationId: operation\.operationId,\n"
              r"    generation: operation\.generation,\n"
              r"    operation,\n"
              r"    consumed: false,\n"
              r"    revoked: false,\n"
              r"  \}\);\n"
              r"  return capability;"
          )
          replacement = '''  const registered: RegisteredStage = {
            project: reconciled,
            operationId: operation.operationId,
            generation: operation.generation,
            operation,
            consumed: false,
            revoked: false,
            detachAbort: null,
          };
          stagedRegistry.set(capability, registered);
          bindStageAbort(registered);
          try {
            assertOperationCurrent(operation, 'standalone Writer project after staging registration');
          } catch (error) {
            releaseRegisteredStage(registered);
            throw error;
          }
          return capability;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('staging registration target not found')
          text = text.replace(
              '  registered.revoked = true;\n  registered.project = null;',
              '  releaseRegisteredStage(registered);',
              1,
          )
          text = text.replace(
              '  } finally {\n    registered.revoked = true;\n    registered.project = null;\n  }\n}',
              '  } finally {\n    releaseRegisteredStage(registered);\n  }\n}',
              1,
          )
          marker = 'function assertUsableStage(\n'
          helpers = '''function bindStageAbort(registered: RegisteredStage): void {
            const signal = registered.operation.signal;
            if (!signal) return;
            const revoke = () => releaseRegisteredStage(registered);
            if (signal.aborted) {
              revoke();
              return;
            }
            signal.addEventListener('abort', revoke, { once: true });
            registered.detachAbort = () => signal.removeEventListener('abort', revoke);
          }

          function releaseRegisteredStage(registered: RegisteredStage): void {
            registered.detachAbort?.();
            registered.detachAbort = null;
            registered.revoked = true;
            registered.project = null;
          }

          '''
          if marker not in text:
              raise SystemExit('stage helper marker not found')
          text = text.replace(marker, helpers + marker, 1)
          controller.write_text(text)

          replace(
              'frontend/src/components/writer-v2/WriterV2ToolbarControls.tsx',
              "    if (isPdf) {\n      try {",
              "    if (isPdf) {\n      const previous = standaloneImportRef.current;\n      previous?.controller.abort('Superseded by an editable PDF project import.');\n      if (previous?.staged) revokeStagedWriterProjectImport(previous.staged);\n      standaloneImportRef.current = null;\n      try {",
              'round-trip supersession',
          )
          replace(
              'frontend/src/components/writer-v2/WriterV2ToolbarControls.test.tsx',
              "  importProjectIntoWriterStore: vi.fn(),\n  importRoundTripPdfIntoWriterStore: vi.fn(),",
              "  stageStandaloneWriterProject: vi.fn(),\n  commitStagedWriterProjectImport: vi.fn(),\n  revokeStagedWriterProjectImport: vi.fn(),\n  importRoundTripPdfIntoWriterStore: vi.fn(),",
              'toolbar controller mock',
          )
          PY
      - name: Verify lifecycle repair
        run: |
          cd frontend
          pnpm run typecheck
          pnpm run lint
          pnpm exec vitest run \
            src/core/writer-v2/export/projectImportController.test.ts \
            src/core/writer-v2/export/projectImportController.source.test.ts \
            src/components/writer-v2/WriterV2ToolbarControls.test.tsx \
            src/core/ocr/__tests__/ocrProjectCodec.test.ts \
            src/core/writer-v2/export/projectZip.test.ts \
            --pool=forks --maxWorkers=1
          pnpm run test:ci
      - name: Commit and remove temporary files
        run: |
          rm -f .github/workflows/phase3a1-final-repair.yml
          rm -f .github/workflows/phase3a1-focused-diagnostics.yml
          rm -f .github/phase3a1-focused.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 3A.1 lifecycle repair"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
