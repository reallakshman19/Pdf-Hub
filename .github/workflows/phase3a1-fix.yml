name: Phase 3A.1 final cleanup
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - name: Apply strict fixes and remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('frontend/src/core/writer-v2/export/projectImportController.test.ts')
          test_text = test_path.read_text()
          old_file = "return new File([project.bytes], 'project.pdfhub.zip', { type: 'application/zip' });"
          new_file = "return new File([Uint8Array.from(project.bytes).buffer], 'project.pdfhub.zip', { type: 'application/zip' });"
          if old_file not in test_text:
              raise SystemExit('BlobPart test target not found')
          test_path.write_text(test_text.replace(old_file, new_file))

          controller_path = Path('frontend/src/core/writer-v2/export/projectImportController.ts')
          controller_text = controller_path.read_text()
          old_freeze = """function deepFreeze<T>(value: T): T {\n  if (value && typeof value === 'object' && !Object.isFrozen(value)) {\n    Object.freeze(value);\n    for (const nested of Object.values(value as Record<string, unknown>)) {\n      deepFreeze(nested);\n    }\n  }\n  return value;\n}\n"""
          new_freeze = """function deepFreeze<T>(value: T): T {\n  if (ArrayBuffer.isView(value)) return value;\n  if (value && typeof value === 'object' && !Object.isFrozen(value)) {\n    Object.freeze(value);\n    for (const nested of Object.values(value as Record<string, unknown>)) {\n      deepFreeze(nested);\n    }\n  }\n  return value;\n}\n"""
          if old_freeze not in controller_text:
              raise SystemExit('deepFreeze target not found')
          controller_path.write_text(controller_text.replace(old_freeze, new_freeze))
          PY
          rm -f \
            .github/phase3a1-fix-trigger \
            .github/workflows/phase3a1-bootstrap.yml \
            .github/workflows/phase3a1-fix.yml \
            .github/workflows/phase3a1-typecheck-diagnostics.yml
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Phase 3A.1 implementation and fix strict types"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
