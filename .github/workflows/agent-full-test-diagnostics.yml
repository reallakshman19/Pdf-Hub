name: agent-full-test-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/pdf-operation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture full Vitest output
        run: |
          set +e
          cd frontend
          set -o pipefail
          pnpm run test 2>&1 | tee ../full-vitest.log
          status=${PIPESTATUS[0]}
          cd ..
          echo "$status" > full-vitest.status
          exit 0
      - name: Upload full test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-full-test-diagnostics
          path: |
            full-vitest.log
            full-vitest.status
