name: agent-publish-cancellation-boundaries

on:
  push:
    branches:
      - agent/pdf-operation-cancellation

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-operation-cancellation
          fetch-depth: 0
      - name: Download tested boundary source
        uses: actions/download-artifact@v4
        with:
          name: agent-cancellation-boundaries-tested-source
          path: /tmp/cancellation-boundaries
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30103494017
      - name: Verify and extract tested source
        run: |
          cat > /tmp/expected-files.txt <<'EOF'
          docs/PDF_OPERATION_CANCELLATION.md
          frontend/src/adapters/pdf-renderer/PdfRendererAdapter.test.ts
          frontend/src/adapters/pdf-renderer/PdfRendererAdapter.ts
          frontend/src/components/sidebar/MacrosSidebar.tsx
          frontend/src/components/sidebar/SearchPanel.tsx
          frontend/src/components/sidebar/panels/ThumbnailSidebar.tsx
          frontend/src/core/ocr/__tests__/tesseractJsEngine.test.ts
          frontend/src/core/ocr/engines/ocrEngineContract.ts
          frontend/src/core/ocr/engines/tesseractJsEngine.ts
          frontend/src/core/renderer/usePageRenderer.ts
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          sort /tmp/cancellation-boundaries/boundary-files.txt > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          tar -xzf /tmp/cancellation-boundaries/cancellation-boundaries-source.tar.gz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        run: cd frontend && pnpm exec tsc --noEmit
      - name: Focused cancellation tests
        run: >-
          cd frontend && pnpm exec vitest run
          src/adapters/pdf-renderer/PdfRendererAdapter.test.ts
          src/core/ocr/__tests__/tesseractJsEngine.test.ts
          src/core/cancellation/operationCancellation.test.ts
          src/core/macro/cancellation.test.ts
          src/core/macro/resourceBudget.test.ts
          src/core/macro/sessionRunner.test.ts
          src/adapters/pdf-edit/PdfEditAdapter.test.ts
          --pool=forks
      - name: Commit tested cancellation boundaries
        run: |
          rm -f \
            scripts/agent_apply_cancellation_boundaries.py \
            .github/workflows/agent-apply-cancellation-boundaries.yml \
            .github/workflows/agent-cancellation-boundaries-diagnostics.yml \
            .github/workflows/agent-publish-cancellation-boundaries.yml \
            frontend/pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs frontend .github/workflows scripts
          git commit -m "Cancel PDF.js rendering OCR and macro UI work"
          git push origin HEAD:agent/pdf-operation-cancellation
