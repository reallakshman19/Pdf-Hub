name: agent-lint-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture lint output
        run: |
          cd frontend
          pnpm lint > ../lint.log 2>&1 || true
      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: agent-lint-log
          path: lint.log
          if-no-files-found: error
