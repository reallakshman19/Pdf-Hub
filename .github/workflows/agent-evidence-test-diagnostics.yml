name: agent-evidence-test-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-test-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture focused test output
        run: |
          cd frontend
          pnpm vitest run src/core/macro/psIsonote/psIsonoteEvidencePackage.test.ts --pool=forks --maxWorkers=1 > ../evidence-test.log 2>&1 || true
      - name: Upload focused test output
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-test-log
          path: evidence-test.log
          if-no-files-found: error
