name: Phase 3B.1 lint diagnostics
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture ESLint diagnostics
        run: |
          set +e
          cd frontend
          pnpm run lint > ../phase3b1-lint.log 2>&1
          status=$?
          cat ../phase3b1-lint.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b1-lint
          path: phase3b1-lint.log
