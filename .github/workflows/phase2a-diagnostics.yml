name: Phase 2A diagnostics

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'agent/donor-pdf-admission-phase2a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Run Phase 2A diagnostics
        id: checks
        working-directory: frontend
        shell: bash
        run: |
          set +e
          pnpm lint > phase2a-lint.log 2>&1
          lint_status=$?
          pnpm typecheck > phase2a-typecheck.log 2>&1
          type_status=$?
          pnpm vitest run \
            src/core/admission/donorPdf.test.ts \
            src/core/admission/donorEntrypoints.test.ts \
            src/core/commands/__tests__/dispatch.test.ts \
            src/components/toolbar/ToolbarOrganize.donor.test.tsx \
            --pool=forks --maxWorkers=1 --reporter=verbose \
            > phase2a-tests.log 2>&1
          test_status=$?
          cat phase2a-lint.log
          cat phase2a-typecheck.log
          cat phase2a-tests.log
          echo "failed=$((lint_status || type_status || test_status))" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Phase 2A diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-diagnostics
          path: |
            frontend/phase2a-lint.log
            frontend/phase2a-typecheck.log
            frontend/phase2a-tests.log
          if-no-files-found: error
      - name: Propagate diagnostic failure
        if: steps.checks.outputs.failed != '0'
        run: exit 1
