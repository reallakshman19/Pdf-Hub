          )
          old_decode = """  assertOperationCurrent(operation, 'standalone Writer project before ZIP decode');\n  const imported = await raceWithAbort(\n    importPdfHubWriterProject(projectBytes),\n    operation.signal,\n    'standalone Writer project ZIP decode',\n  );\n  assertOperationCurrent(operation, 'standalone Writer project after ZIP decode');\n\n  const reconciled = await reconcileImportedProject(imported, operation, diagnostics);\n"""
          new_decode = """  assertOperationCurrent(operation, 'standalone Writer project before ZIP decode');\n  let imported: ImportPdfHubProjectResult;\n  try {\n    imported = await raceWithAbort(\n      (dependencies.decodeProject ?? importPdfHubWriterProject)(projectBytes),\n      operation.signal,\n      'standalone Writer project ZIP decode',\n    );\n  } catch (error) {\n    if (isOperationCancelledError(error)) throw error;\n    throw normalizeProjectDecodeError(error);\n  }\n  assertOperationCurrent(operation, 'standalone Writer project after ZIP decode');\n\n  const reconciled = await reconcileImportedProject(\n    imported,\n    file.name,\n    operation,\n    dependencies,\n    diagnostics,\n  );\n"""
          text = replace_once(text, old_decode, new_decode, 'decode block')
          text = replace_once(
              text,
              "        fileName: 'imported-writer-project.pdf',",
              "        fileName: project.sessionFileName,",
              'session file name',
          )
          text = replace_once(
              text,
              "async function reconcileImportedProject(\n  imported: ImportPdfHubProjectResult,\n  operation: StandaloneWriterProjectOperation,\n  diagnostics: WriterProjectImportDiagnostic[],\n): Promise<ProtectedProject> {",
              "async function reconcileImportedProject(\n  imported: ImportPdfHubProjectResult,\n  sourceFileName: string,\n  operation: StandaloneWriterProjectOperation,\n  dependencies: StandaloneWriterProjectStageDependencies,\n  diagnostics: WriterProjectImportDiagnostic[],\n): Promise<ProtectedProject> {",
              'reconcile signature',
          )
          semantic_start = text.index('  const manifest = imported.manifest;', text.index('async function reconcileImportedProject'))
          semantic_end = text.index('  const hasOriginalPdf = imported.originalPdfBytes.byteLength > 0;', semantic_start)
          semantic_new = """  const manifest = imported.manifest;\n  if (manifest.schema !== 'pdf-hub-project' || manifest.schemaVersion !== 1) {\n    throw new Error('Writer project manifest schema is not supported.');\n  }\n  if (typeof manifest.documentFingerprint !== 'string' || !manifest.documentFingerprint.trim()) {\n    throw new Error('Writer project manifest is missing documentFingerprint.');\n  }\n  if (!Array.isArray(imported.elements)) {\n    throw new Error('Writer project elements must be an array.');\n  }\n  if (!Array.isArray(imported.assets)) {\n    throw new Error('Writer project assets must be an array.');\n  }\n  if (\n    !manifest.counts ||\n    !Number.isInteger(manifest.counts.writerElements) ||\n    !Number.isInteger(manifest.counts.writerAssets)\n  ) {\n    throw new Error('Writer project manifest counts are invalid.');\n  }\n  if (manifest.counts.writerElements !== imported.elements.length) {\n    throw new Error('Writer project element count does not match its manifest.');\n  }\n  if (manifest.counts.writerAssets !== imported.assets.length) {\n    throw new Error('Writer project asset count does not match its manifest.');\n  }\n\n  for (const element of imported.elements) {\n    if (!element || typeof element !== 'object') {\n      throw new Error('Writer project contains a malformed Writer element.');\n    }\n  }\n  for (const asset of imported.assets) {\n    if (!asset || typeof asset !== 'object') {\n      throw new Error('Writer project contains malformed Writer asset metadata.');\n    }\n  }\n\n  validateUniqueIds(imported.elements.map((element) => element.id), 'Writer element');\n  validateUniqueIds(imported.assets.map((asset) => asset.id), 'Writer asset');\n  validateAssetReferences(imported.elements, imported.assets);\n\n  for (const warning of imported.compatibilityWarnings ?? []) {\n    diagnostics.push({\n      severity: 'warning',\n      code: 'WRITER_PROJECT_FINGERPRINT_NORMALIZED',\n      message: warning,\n    });\n  }\n\n  const declaredModeValues: readonly unknown[] = [\n    manifest.documentMode,\n    manifest.source?.kind,\n    imported.documentMeta?.mode,\n  ];\n  for (const value of declaredModeValues) {\n    if (value !== undefined && value !== 'pdfOverlay' && value !== 'blankDocument') {\n      throw new Error('Writer project declares an unsupported document mode.');\n    }\n  }\n  const declaredModes = declaredModeValues.filter(\n    (value): value is 'pdfOverlay' | 'blankDocument' =>\n      value === 'pdfOverlay' || value === 'blankDocument',\n  );\n  if (new Set(declaredModes).size > 1) {\n    throw new Error('Writer project contains contradictory document mode declarations.');\n  }\n  const mode = declaredModes[0] ?? 'pdfOverlay';\n"""
          text = text[:semantic_start] + semantic_new + text[semantic_end:]
          old_pdf = """    assertOperationCurrent(operation, 'Writer project before original PDF validation');\n    const pdf = await raceWithAbort(\n      PDFDocument.load(imported.originalPdfBytes),\n      operation.signal,\n      'Writer project original PDF validation',\n    );\n    assertOperationCurrent(operation, 'Writer project after original PDF validation');\n    pageCount = pdf.getPageCount();\n"""
          new_pdf = """    assertOperationCurrent(operation, 'Writer project before original PDF validation');\n    try {\n      pageCount = await raceWithAbort(\n        (dependencies.countPdfPages ?? countPdfPages)(\n          imported.originalPdfBytes,\n          operation.signal,\n        ),\n        operation.signal,\n        'Writer project original PDF validation',\n      );\n    } catch (error) {\n      if (isOperationCancelledError(error)) throw error;\n      throw new Error('Writer project original PDF could not be parsed.');\n    }\n    assertOperationCurrent(operation, 'Writer project after original PDF validation');\n"""
          text = replace_once(text, old_pdf, new_pdf, 'PDF validation')
          text = replace_once(
              text,
              "  return deepFreeze({\n    manifest: cloneManifest(manifest),",
              "  return deepFreeze({\n    manifest: cloneManifest(manifest),\n    sessionFileName: standaloneProjectPdfFileName(sourceFileName),",
              'protected return file name',
          )
          text = replace_once(
              text,
              "  if (\n    registered.operationId !== operation.operationId ||",
              "  if (\n    registered.operation !== operation ||\n    registered.operationId !== operation.operationId ||",
              'operation identity',
          )
          text = replace_once(
              text,
              "  for (const element of elements) {\n    if (!element.assetIds) continue;",
              "  for (const element of elements) {\n    if (element.assetIds === undefined) continue;\n    if (!Array.isArray(element.assetIds)) {\n      throw new Error(`Writer element ${element.id} contains malformed asset references.`);\n    }",
              'asset reference array',
          )
          helper_marker = "function inferredMode(imported: ImportPdfHubProjectResult): 'pdfOverlay' | 'blankDocument' {"
          helpers = """async function countPdfPages(\n  bytes: Uint8Array,\n  _signal?: AbortSignal,\n): Promise<number> {\n  const pdf = await PDFDocument.load(bytes);\n  return pdf.getPageCount();\n}\n\nfunction normalizeProjectDecodeError(error: unknown): Error {\n  const message = error instanceof Error ? error.message : String(error);\n  if (\n    message.startsWith('Project ZIP missing required file:') ||\n    message.startsWith('Unsupported project schema:') ||\n    message.startsWith('Unsupported project schemaVersion:') ||\n    message.startsWith('Project manifest is missing documentFingerprint.') ||\n    message.startsWith('Writer project contains invalid JSON') ||\n    message.startsWith('Writer project manifest') ||\n    message.startsWith('Writer project elements') ||\n    message.startsWith('Writer project assets') ||\n    message.startsWith('Writer project document metadata')\n  ) {\n    return error instanceof Error ? error : new Error(message);\n  }\n  return new Error('Writer project ZIP could not be decoded.');\n}\n\nfunction standaloneProjectPdfFileName(sourceFileName: string): string {\n  const withoutProjectSuffix = sourceFileName.replace(/\\.pdfhub\\.zip$/i, '');\n  const withoutZipSuffix = withoutProjectSuffix.replace(/\\.zip$/i, '');\n  return `${withoutZipSuffix || 'imported-writer-project'}.pdf`;\n}\n\n"""
          if helper_marker not in text:
              raise SystemExit('helper insertion marker not found')
          text = text.replace(helper_marker, helpers + helper_marker, 1)
          controller_path.write_text(text)

          project_zip_path = Path('frontend/src/core/writer-v2/export/projectZip.ts')
          zip_text = project_zip_path.read_text()
          start = zip_text.index('export async function importPdfHubWriterProject(')
          end = zip_text.index('async function readBinaryFile(', start)
          new_import = r'''export async function importPdfHubWriterProject(
  projectBytes: Uint8Array,
): Promise<ImportPdfHubProjectResult> {
  const zip = await JSZip.loadAsync(projectBytes);

  const manifestValue = await readJsonFile<unknown>(zip, 'manifest.json');
  validateManifest(manifestValue);
  const manifest = manifestValue;

  const originalPdfBytes = manifest.files.originalPdf
    ? await readBinaryFile(zip, manifest.files.originalPdf)
    : new Uint8Array();

  const documentMetaValue = manifest.files.writerDocumentMeta
    ? await readJsonFile<unknown>(zip, manifest.files.writerDocumentMeta)
    : null;
  const documentMeta = validateWriterDocumentMeta(documentMetaValue);

  const elementsValue = await readJsonFile<unknown>(zip, manifest.files.writerElements);
  const elements = validateWriterElements(elementsValue);

  const storedAssetsValue = await readJsonFile<unknown>(zip, manifest.files.writerAssets);
  const storedAssets = validateStoredAssets(storedAssetsValue);
  const assets: WriterAssetRecordV2[] = [];

  for (const asset of storedAssets) {
    const bytes = await readBinaryFile(
      zip,
      `${manifest.files.assetDirectory}${asset.fileName}`,
    );

    assets.push({
      id: asset.id,
      documentFingerprint: manifest.documentFingerprint,
      kind: asset.kind,
      mimeType: asset.mimeType,
      dataUrl: bytesToDataUrl(bytes, asset.mimeType),
      width: asset.width,
      height: asset.height,
      createdAt: asset.createdAt,
      updatedAt: asset.updatedAt,
    });
  }

  const ocrProject = await readOcrProjectPayloadFromZip(zip);
  const compatibilityWarnings: string[] = [];
  if (documentMeta && documentMeta.documentFingerprint !== manifest.documentFingerprint) {
    compatibilityWarnings.push('Writer document metadata fingerprint was normalized to the manifest fingerprint.');
  }
  for (const element of elements) {
    if (element.documentFingerprint !== manifest.documentFingerprint) {
      compatibilityWarnings.push(`Writer element ${element.id || '(unnamed)'} fingerprint was normalized to the manifest fingerprint.`);
    }
  }
  for (const asset of storedAssets) {
    if (asset.documentFingerprint !== manifest.documentFingerprint) {
      compatibilityWarnings.push(`Writer asset ${asset.id || '(unnamed)'} fingerprint was normalized to the manifest fingerprint.`);
    }
  }

  return {
    manifest,
    originalPdfBytes,
    documentMeta: documentMeta
      ? {
          ...documentMeta,
          documentFingerprint: manifest.documentFingerprint,
        }
      : null,
    elements: elements.map((element) => ({
      ...element,
      documentFingerprint: manifest.documentFingerprint,
      assetIds: element.assetIds ? [...element.assetIds] : undefined,
      rect: { ...element.rect },
      style: { ...element.style },
    })),
    assets,
    ocrProject,
    compatibilityWarnings: Object.freeze([...compatibilityWarnings]),
  };
}

function validateManifest(value: unknown): asserts value is PdfHubWriterProjectManifestV1 {
  if (!isRecord(value)) {
    throw new Error('Writer project manifest must be an object.');
  }
  if (value.schema !== 'pdf-hub-project') {
    throw new Error(`Unsupported project schema: ${String(value.schema)}`);
  }
  if (value.schemaVersion !== 1) {
    throw new Error(`Unsupported project schemaVersion: ${String(value.schemaVersion)}`);
  }
  if (typeof value.documentFingerprint !== 'string' || !value.documentFingerprint.trim()) {
    throw new Error('Project manifest is missing documentFingerprint.');
  }
  if (!isRecord(value.files)) {
    throw new Error('Writer project manifest files are invalid.');
  }
  if (
    typeof value.files.writerElements !== 'string' ||
    typeof value.files.writerAssets !== 'string' ||
    typeof value.files.assetDirectory !== 'string'
  ) {
    throw new Error('Writer project manifest required file references are invalid.');
  }
  if (!isRecord(value.counts)) {
    throw new Error('Writer project manifest counts are invalid.');
  }
  if (
    !Number.isInteger(value.counts.writerElements) ||
    Number(value.counts.writerElements) < 0 ||
    !Number.isInteger(value.counts.writerAssets) ||
    Number(value.counts.writerAssets) < 0
  ) {
    throw new Error('Writer project manifest counts are invalid.');
  }
  if (
    value.documentMode !== undefined &&
    value.documentMode !== 'pdfOverlay' &&
    value.documentMode !== 'blankDocument'
  ) {
    throw new Error('Writer project manifest document mode is invalid.');
  }
  if (value.source !== undefined) {
    if (!isRecord(value.source)) {
      throw new Error('Writer project manifest source is invalid.');
    }
    if (value.source.kind !== 'pdfOverlay' && value.source.kind !== 'blankDocument') {
      throw new Error('Writer project manifest source mode is invalid.');
    }
    if (typeof value.source.hasOriginalPdf !== 'boolean') {
      throw new Error('Writer project manifest source PDF declaration is invalid.');
    }
  }
}

function validateWriterDocumentMeta(value: unknown): WriterDocumentMetaV2 | null {
  if (value === null) return null;
  if (!isRecord(value)) {
    throw new Error('Writer project document metadata must be an object.');
  }
  if (
    typeof value.documentFingerprint !== 'string' ||
    (value.mode !== 'pdfOverlay' && value.mode !== 'blankDocument') ||
    !Number.isInteger(value.pageCount) ||
    Number(value.pageCount) < 1 ||
    !isRecord(value.pageSetup)
  ) {
    throw new Error('Writer project document metadata is invalid.');
  }
  return value as unknown as WriterDocumentMetaV2;
}

function validateWriterElements(value: unknown): WriterElementV2[] {
  if (!Array.isArray(value) || value.some((entry) => !isRecord(entry))) {
    throw new Error('Writer project elements must be an array of objects.');
  }
  return value as WriterElementV2[];
}

function validateStoredAssets(value: unknown): StoredAssetMetadata[] {
  if (!Array.isArray(value) || value.some((entry) => !isRecord(entry))) {
    throw new Error('Writer project assets must be an array of objects.');
  }
  for (const entry of value) {
    if (
      typeof entry.id !== 'string' ||
      typeof entry.documentFingerprint !== 'string' ||
      entry.kind !== 'image' ||
      typeof entry.mimeType !== 'string' ||
      typeof entry.fileName !== 'string' ||
      typeof entry.createdAt !== 'string' ||
      typeof entry.updatedAt !== 'string'
    ) {
      throw new Error('Writer project asset metadata is invalid.');
    }
  }
  return value as StoredAssetMetadata[];
}

async function readJsonFile<T>(zip: JSZip, path: string): Promise<T> {
  const file = zip.file(path);
  if (!file) {
    throw new Error(`Project ZIP missing required file: ${path}`);
  }
  const text = await file.async('string');
  try {
    return JSON.parse(text) as T;
  } catch {
    throw new Error(`Writer project contains invalid JSON in ${path}.`);
  }
}

function isRecord(value: unknown): value is Record<string, unknown> {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

