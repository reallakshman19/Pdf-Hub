          )
          text = replace_once(
              text,
              "export async function stageStandaloneWriterProject(\n  file: File,\n  operation: StandaloneWriterProjectOperation,\n): Promise<StagedWriterProjectImport> {",
              "export async function stageStandaloneWriterProject(\n  file: File,\n  operation: StandaloneWriterProjectOperation,\n  dependencies: StandaloneWriterProjectStageDependencies = {},\n): Promise<StagedWriterProjectImport> {",
