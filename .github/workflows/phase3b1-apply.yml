name: Phase 3B.1 production integration
on:
  push:
    branches:
      - agent/raw-zip-structural-admission-phase3b1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-zip-structural-admission-phase3b1
          fetch-depth: 0
      - name: Integrate raw ZIP admission before project decoding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} target not found')
              return text.replace(old, new, 1)

          path = Path('frontend/src/core/writer-v2/export/projectImportController.ts')
          text = path.read_text()

          cancellation_import = """import {
            isOperationCancelledError,
            raceWithAbort,
            throwIfAborted,
          } from '@/core/cancellation/operationCancellation';
          """
          admission_imports = cancellation_import + """import { inspectZipArchive } from '@/core/admission/zip/zipInventory';
          import { admitZipArchive } from '@/core/admission/zip/zipAdmission';
          import type { ZipArchiveInventory } from '@/core/admission/zip/zipTypes';
          """
          text = replace_once(text, cancellation_import, admission_imports, 'admission imports')

          evidence_old = """  readonly diagnostics: readonly WriterProjectImportDiagnostic[];
            readonly unresolvedPolicy: {
          """
          evidence_new = """  readonly diagnostics: readonly WriterProjectImportDiagnostic[];
            readonly zipStructuralAdmission: ZipArchiveInventory;
            readonly unresolvedPolicy: {
          """
          text = replace_once(text, evidence_old, evidence_new, 'evidence inventory')

          operation_old = """export interface StandaloneWriterProjectOperation {
            readonly operationId: string;
            readonly generation: number;
            readonly signal?: AbortSignal;
            readonly isCurrent: () => boolean;
            readonly isMounted: () => boolean;
          }

          export interface StagedWriterProjectImport {
          """
          operation_new = """export interface StandaloneWriterProjectOperation {
            readonly operationId: string;
            readonly generation: number;
            readonly signal?: AbortSignal;
            readonly isCurrent: () => boolean;
            readonly isMounted: () => boolean;
          }

          export interface StandaloneWriterProjectStageDependencies {
            readonly inspectArchive?: (bytes: Uint8Array) => ZipArchiveInventory;
            readonly decodeProject?: (bytes: Uint8Array) => Promise<ImportPdfHubProjectResult>;
          }

          export interface StagedWriterProjectImport {
          """
          text = replace_once(text, operation_old, operation_new, 'stage dependencies')

          signature_old = """export async function stageStandaloneWriterProject(
            file: File,
            operation: StandaloneWriterProjectOperation,
          ): Promise<StagedWriterProjectImport> {
          """
          signature_new = """export async function stageStandaloneWriterProject(
            file: File,
            operation: StandaloneWriterProjectOperation,
            dependencies: StandaloneWriterProjectStageDependencies = {},
          ): Promise<StagedWriterProjectImport> {
          """
          text = replace_once(text, signature_old, signature_new, 'stage signature')

          decode_old = """  assertOperationCurrent(operation, 'standalone Writer project before ZIP decode');
            const imported = await raceWithAbort(
              importPdfHubWriterProject(projectBytes),
              operation.signal,
              'standalone Writer project ZIP decode',
            );
            assertOperationCurrent(operation, 'standalone Writer project after ZIP decode');
          """
          decode_new = """  assertOperationCurrent(operation, 'standalone Writer project before raw ZIP inspection');
            const inventory = (dependencies.inspectArchive ?? inspectZipArchive)(projectBytes);
            assertOperationCurrent(operation, 'standalone Writer project after raw ZIP inspection');
            admitZipArchive(inventory);
            assertOperationCurrent(operation, 'standalone Writer project before compatibility ZIP decode');
            const imported = await raceWithAbort(
              (dependencies.decodeProject ?? importPdfHubWriterProject)(projectBytes),
              operation.signal,
              'standalone Writer project ZIP decode',
            );
            assertOperationCurrent(operation, 'standalone Writer project after ZIP decode');
          """
          text = replace_once(text, decode_old, decode_new, 'raw admission block')

          evidence_value_old = """    zipSignature: 'accepted' as const,
              schema: imported.manifest.schema,
          """
          evidence_value_new = """    zipSignature: 'accepted' as const,
              zipStructuralAdmission: inventory,
              schema: imported.manifest.schema,
          """
          text = replace_once(text, evidence_value_old, evidence_value_new, 'evidence value')

          path.write_text(text)

          source_test_path = Path('frontend/src/core/writer-v2/export/projectImportController.source.test.ts')
          source_test = source_test_path.read_text()
          assertions_old = """    expect(stageBoundary).not.toContain('useWriterV2Store.setState');
          """
          assertions_new = """    expect(stageBoundary).toContain('inspectZipArchive');
              expect(stageBoundary).toContain('admitZipArchive');
              expect(stageBoundary.indexOf('admitZipArchive')).toBeLessThan(
                stageBoundary.indexOf('importPdfHubWriterProject'),
              );
              expect(stageBoundary).not.toContain('useWriterV2Store.setState');
          """
          source_test = replace_once(source_test, assertions_old, assertions_new, 'source route assertions')
          source_test_path.write_text(source_test)
          PY
          rm .github/workflows/phase3b1-apply.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate raw ZIP admission before project decoding"
          git push origin HEAD:agent/raw-zip-structural-admission-phase3b1
