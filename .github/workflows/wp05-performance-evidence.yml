name: WP-05 B01-B02 Correctness-gated Performance Evidence

on:
  pull_request:
    paths:
      - "frontend/e2e/wp05-b01-performance.spec.ts"
      - "frontend/e2e/wp05-b02-performance.spec.ts"
      - "frontend/e2e/fixtures/wp05-source-f01-f08/**"
      - ".github/workflows/wp05-performance-evidence.yml"
  workflow_dispatch:

concurrency:
  group: wp05-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workload: ["B01-F03", "B02-F05-100", "B02-F06-500"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind source candidate
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'WP05_PERF_CHECKED_OUT_HEAD=%s\n' "$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: pnpm -C frontend install --frozen-lockfile
      - name: Reproduce and validate exact original public F01-F08 source PDF bytes
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9 pillow==12.3.0
          python frontend/e2e/fixtures/wp05-source-f01-f08/generate.py
          python frontend/e2e/fixtures/wp05-source-f01-f08/verify_fixtures.py
      - name: Install pinned Chromium
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Build exact-head PDF Hub
        run: VITE_BASE_PATH=/Pdf-Hub/ pnpm -C frontend run build
      - name: Boot compiled production preview
        run: |
          pnpm -C frontend exec vite preview --host 127.0.0.1 --port 5173 --strictPort > /tmp/wp05-perf-preview.log 2>&1 &
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/Pdf-Hub/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wp05-perf-preview.log
          exit 1
      - name: B01/B02 2 warmup + 10 correctness-gated measured trials
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173/Pdf-Hub/
          WP05_BENCH_WORKLOAD: ${{ matrix.workload }}
        run: |
          case "$WP05_BENCH_WORKLOAD" in
            B01-F03)
              WP05_RUN_B01=1 pnpm -C frontend exec playwright test e2e/wp05-b01-performance.spec.ts --project=chromium --reporter=line --retries=0 --output=test-results/wp05-b01
              ;;
            B02-F05-100)
              WP05_RUN_B02=1 pnpm -C frontend exec playwright test e2e/wp05-b02-performance.spec.ts --project=chromium --grep "100 pages" --reporter=line --retries=0 --output=test-results/wp05-b02-100
              ;;
            B02-F06-500)
              WP05_RUN_B02=1 pnpm -C frontend exec playwright test e2e/wp05-b02-performance.spec.ts --project=chromium --grep "500 pages" --reporter=line --retries=0 --output=test-results/wp05-b02-500
              ;;
            *) echo "Unexpected benchmark workload" >&2; exit 1;;
          esac
      - name: Hash evidence files
        if: always()
        run: |
          mkdir -p frontend/wp05-evidence
          find frontend/wp05-evidence -type f ! -name WP05_PERFORMANCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > frontend/wp05-evidence/WP05_PERFORMANCE_SHA256SUMS.txt
      - name: Retain raw source-bound samples and failure contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp05-performance-${{ matrix.workload }}
          path: |
            frontend/wp05-evidence/
            frontend/test-results/
            /tmp/wp05-perf-preview.log
          if-no-files-found: warn
          retention-days: 14
