name: Phase 3B.2 focused closure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase3b2-focused-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-diagnostic:
    if: github.event.pull_request.number == 138
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-zip-extraction-phase3b2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Capture lint result
        working-directory: frontend
        run: |
          set +e
          mkdir -p ../artifacts
          pnpm run lint > ../artifacts/phase3b2-lint.txt 2>&1
          status=$?
          cat ../artifacts/phase3b2-lint.txt
          exit "$status"

      - name: Upload lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b2-lint-diagnostic
          path: artifacts/phase3b2-lint.txt
          if-no-files-found: error
