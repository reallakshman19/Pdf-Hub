name: Apply Phase 3B.3A scoped fix

on:
  push:
    branches:
      - agent/static-project-member-admission-phase3b3a

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-project-member-admission-phase3b3a
          fetch-depth: 0

      - name: Apply role-status overloads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/core/admission/zip/writerProjectMemberAdmission.ts')
          text = path.read_text()
          required_call = 'roleStatus<WriterProjectRequiredRootFile>(records, role)'
          optional_call = 'roleStatus<WriterProjectOptionalRootFile>(records, role)'
          if text.count(required_call) != 1 or text.count(optional_call) != 1:
              raise SystemExit('Role-status call markers changed unexpectedly.')
          text = text.replace(required_call, 'roleStatus(records, role)', 1)
          text = text.replace(optional_call, 'roleStatus(records, role)', 1)
          start_marker = 'function roleStatus<T extends string>('
          end_marker = 'function emptyClassificationCounts()'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '\n'.join([
              'function roleStatus(',
              '  records: readonly WriterProjectMemberAdmissionRecord[],',
              '  role: WriterProjectRequiredRootFile,',
              '): WriterProjectRequiredRoleStatus;',
              'function roleStatus(',
              '  records: readonly WriterProjectMemberAdmissionRecord[],',
              '  role: WriterProjectOptionalRootFile,',
              '): WriterProjectOptionalRoleStatus;',
              'function roleStatus(',
              '  records: readonly WriterProjectMemberAdmissionRecord[],',
              '  role: WriterProjectRequiredRootFile | WriterProjectOptionalRootFile,',
              '): WriterProjectRequiredRoleStatus | WriterProjectOptionalRoleStatus {',
              '  const record = records.find(',
              '    (candidate) =>',
              "      candidate.role === role && candidate.admissionOutcome === 'ADMITTED',",
              '  );',
              '  return {',
              '    role,',
              '    present: Boolean(record),',
              '    ...(record ? { ordinal: record.ordinal } : {}),',
              '  };',
              '}',
              '',
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/phase3b3a-apply-fix-clean.yml
          rm -f .github/workflows/phase3b3a-apply-role-fix.yml
          rm -f .github/workflows/phase3b3a-focused.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/core/admission/zip/writerProjectMemberAdmission.ts .github/workflows/phase3b3a-apply-fix-clean.yml .github/workflows/phase3b3a-apply-role-fix.yml .github/workflows/phase3b3a-focused.yml
          git commit -m 'Fix Phase 3B.3A role evidence typing'
          git push origin HEAD:agent/static-project-member-admission-phase3b3a
