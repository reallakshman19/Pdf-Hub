name: agent-cancellation-full-test-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    if: github.head_ref == 'agent/pdf-operation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Capture full test output
        continue-on-error: true
        run: |
          set -o pipefail
          cd frontend
          pnpm run test 2>&1 | tee ../cancellation-full-tests.log
      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cancellation-full-test-log
          path: cancellation-full-tests.log
