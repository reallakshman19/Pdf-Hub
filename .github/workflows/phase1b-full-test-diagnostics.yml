name: Phase 1B full-suite diagnostics

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Run full Vitest suite
        id: full_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          pnpm vitest run --pool=forks --maxWorkers=1 --reporter=verbose \
            > phase1b-full-tests.log 2>&1
          status=$?
          tail -n 200 phase1b-full-tests.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-full-tests
          path: frontend/phase1b-full-tests.log
          if-no-files-found: error

      - name: Propagate full test result
        if: steps.full_tests.outputs.exit_code != '0'
        run: exit 1
