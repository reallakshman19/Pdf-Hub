name: OCR Workflow Certification

on:
  pull_request:
    paths:
      - "frontend/src/components/ocr/**"
      - "frontend/src/core/ocr/**"
      - "frontend/scripts/certify-writer-v2-ocr.mjs"
      - ".github/workflows/ocr-workflow-certification.yml"
  workflow_dispatch:

jobs:
  ocr-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run certify:writer-v2-ocr:static
      - run: pnpm exec vitest run src/components/ocr/__tests__/OcrWorkflowShell.test.tsx src/components/ocr/__tests__/OcrPanelWriterConnected.test.tsx src/components/ocr/__tests__/OcrRunControls.test.tsx --pool=forks --maxWorkers=1
      - run: pnpm run build
