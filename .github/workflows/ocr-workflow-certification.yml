name: OCR Workflow Certification

on:
  pull_request:
    paths:
      - "frontend/src/components/ocr/**"
      - "frontend/src/core/ocr/**"
      - "frontend/scripts/certify-writer-v2-ocr.mjs"
      - ".github/workflows/ocr-workflow-certification.yml"
  workflow_dispatch:

jobs:
  ocr-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:ci
      - run: pnpm run check:doc-hub
      - run: pnpm run check:static
      - run: pnpm run build
      - run: pnpm run check:release
