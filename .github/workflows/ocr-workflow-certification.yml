name: OCR Workflow Certification

on:
  pull_request:
    paths:
      - 'frontend/src/components/ocr/**'
      - 'frontend/src/core/ocr/**'
      - 'frontend/scripts/certify-writer-v2-ocr.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/ocr-workflow-certification.yml'
  workflow_dispatch:

jobs:
  certify-ocr-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --config.frozen-lockfile=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test CI
        run: pnpm run test:ci

      - name: Check Doc Hub
        run: pnpm run check:doc-hub

      - name: Check static contracts
        run: pnpm run check:static

      - name: Build
        run: pnpm run build

      - name: Check release
        run: pnpm run check:release
