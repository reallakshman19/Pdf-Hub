name: Phase 2A diagnostic fixes

on:
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/donor-pdf-admission-phase2a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-pdf-admission-phase2a
          fetch-depth: 0
      - name: Apply narrow diagnostic fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          toolbar_path = Path('frontend/src/components/toolbar/ToolbarOrganize.donor.test.tsx')
          toolbar = toolbar_path.read_text(encoding='utf-8')
          toolbar = toolbar.replace(
              """    variant: _variant,
              size: _size,
          """,
              '',
              1,
          )
          toolbar = toolbar.replace(
              """  }: React.ButtonHTMLAttributes<HTMLButtonElement> & {
              variant?: string;
              size?: string;
            }) => <button {...props}>{children}</button>,
          """,
              """  }: React.ButtonHTMLAttributes<HTMLButtonElement>) => (
              <button {...props}>{children}</button>
            ),
          """,
              1,
          )
          toolbar_path.write_text(toolbar, encoding='utf-8')

          donor_path = Path('frontend/src/core/admission/donorPdf.test.ts')
          donor = donor_path.read_text(encoding='utf-8')
          start_marker = "  it('suppresses a late result after a newer donor operation starts', async () => {"
          end_marker = "\n  it('rejects dispatch after the owning document context changes', async () => {"
          start = donor.index(start_marker)
          end = donor.index(end_marker, start)
          replacement = """  it('suppresses a late result after a newer donor operation starts', async () => {
              const first = createSource(pdfBytes('first'), { name: 'first.pdf' });
              const second = createSource(pdfBytes('second'), { name: 'second.pdf' });
              const firstCount = createDeferred<number>();
              const countPages = vi.spyOn(PdfEditAdapter, 'countPages')
                .mockImplementationOnce(() => firstCount.promise)
                .mockResolvedValueOnce(2);
          
              const firstResultPromise = admitDonorPdfFiles(
                [first],
                'TOOLBAR_ORGANIZE',
                'INSERT_PAGES',
                { ownerDocumentKey: 'doc-1' },
              );
              await vi.waitFor(() => {
                expect(countPages).toHaveBeenCalledTimes(1);
              });
              const secondResult = await admitDonorPdfFiles(
                [second],
                'TOOLBAR_ORGANIZE',
                'INSERT_PAGES',
                { ownerDocumentKey: 'doc-1' },
              );
              firstCount.resolve(1);
              const firstResult = await firstResultPromise;
          
              expect(secondResult.outcome).toBe('ACCEPTED');
              expect(firstResult.outcome).toBe('CANCELLED');
            });
          """
          donor_path.write_text(donor[:start] + replacement + donor[end:], encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary diagnostics
        shell: bash
        run: |
          git config user.name "OpenAI Implementation Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2a-diagnostics.yml
          git rm .github/workflows/phase2a-fix-bootstrap.yml
          git add frontend
          git commit -m "Fix Phase 2A lint and deterministic tests"
          git push origin HEAD:agent/donor-pdf-admission-phase2a
