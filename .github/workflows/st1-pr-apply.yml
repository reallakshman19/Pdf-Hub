name: ST-1 focused implementation gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ps-isonote-text-admission-st1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Apply transactional builder integration
        run: python .github/st1_apply.py
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile --silent
      - name: Policy tests
        run: cd frontend && pnpm exec vitest run src/core/macro/psIsonote/psIsonoteTextAdmissionPolicy.test.ts --pool=forks --maxWorkers=1
      - name: Core admission tests
        run: cd frontend && pnpm exec vitest run src/core/macro/psIsonote/psIsonoteTextAdmission.test.ts --pool=forks --maxWorkers=1
      - name: Existing parser and sample tests
        run: |
          cd frontend
          pnpm exec vitest run \
            src/core/macro/psIsonote/psIsonoteTable.test.ts \
            src/core/macro/psIsonote/psIsonoteSamples.test.ts \
            --pool=forks --maxWorkers=1
      - name: Existing sample loader tests
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteSampleLoader.test.tsx --pool=forks --maxWorkers=1
      - name: Builder typed-text admission
        id: builder_typed
        continue-on-error: true
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteRecipeBuilder.admission.test.tsx -t "admits typed text" --pool=forks --maxWorkers=1
      - name: Builder sample admission
        id: builder_sample
        continue-on-error: true
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteRecipeBuilder.admission.test.tsx -t "routes embedded samples" --pool=forks --maxWorkers=1
      - name: Builder rejected typed candidate preservation
        id: builder_rejected_typed
        continue-on-error: true
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteRecipeBuilder.admission.test.tsx -t "preserves the last admitted source" --pool=forks --maxWorkers=1
      - name: Builder accepted file admission
        id: builder_file
        continue-on-error: true
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteRecipeBuilder.admission.test.tsx -t "admits a file once" --pool=forks --maxWorkers=1
      - name: Builder rejected file preservation
        id: builder_rejected_file
        continue-on-error: true
        run: cd frontend && pnpm exec vitest run src/components/sidebar/PsIsonoteRecipeBuilder.admission.test.tsx -t "rejects oversized file metadata" --pool=forks --maxWorkers=1
      - name: Builder admission scenario gate
        if: always()
        run: |
          test "${{ steps.builder_typed.outcome }}" = success
          test "${{ steps.builder_sample.outcome }}" = success
          test "${{ steps.builder_rejected_typed.outcome }}" = success
          test "${{ steps.builder_file.outcome }}" = success
          test "${{ steps.builder_rejected_file.outcome }}" = success
      - name: Strict TypeScript
        run: cd frontend && pnpm run typecheck
      - name: Lint
        run: cd frontend && pnpm run lint
      - name: Commit successful integration and remove temporary runner files
        run: |
          rm .github/st1_apply.py
          rm .github/workflows/st1-apply-and-focus.yml
          rm .github/workflows/st1-pr-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate ST-1 structured-text admission"
          git push origin HEAD:agent/ps-isonote-text-admission-st1
