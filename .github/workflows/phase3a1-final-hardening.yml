name: Phase 3A.1 final hardening
on:
  push:
    branches:
      - agent/atomic-writer-project-import-phase3a1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-writer-project-import-phase3a1
          fetch-depth: 0
      - name: Harden validation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/core/writer-v2/export/projectImportController.ts')
          text = path.read_text()

          replacements = [
            (
              "import {\n  raceWithAbort,\n  throwIfAborted,\n} from '@/core/cancellation/operationCancellation';",
              "import {\n  isOperationCancelledError,\n  raceWithAbort,\n  throwIfAborted,\n} from '@/core/cancellation/operationCancellation';",
              'cancellation import',
            ),
            (
              "  const mode = inferredMode(imported);",
              "  const declaredModes = [\n    imported.documentMeta?.mode,\n    manifest.documentMode,\n    manifest.source?.kind,\n  ].filter((value): value is 'pdfOverlay' | 'blankDocument' =>\n    value === 'pdfOverlay' || value === 'blankDocument',\n  );\n  if (new Set(declaredModes).size > 1) {\n    throw new Error('Writer project contains contradictory document mode declarations.');\n  }\n  const mode = declaredModes[0] ?? 'pdfOverlay';",
              'mode reconciliation',
            ),
            (
              "    const pdf = await raceWithAbort(\n      PDFDocument.load(imported.originalPdfBytes),\n      operation.signal,\n      'Writer project original PDF validation',\n    );\n    assertOperationCurrent(operation, 'Writer project after original PDF validation');\n    pageCount = pdf.getPageCount();",
              "    try {\n      const pdf = await raceWithAbort(\n        PDFDocument.load(imported.originalPdfBytes),\n        operation.signal,\n        'Writer project original PDF validation',\n      );\n      assertOperationCurrent(operation, 'Writer project after original PDF validation');\n      pageCount = pdf.getPageCount();\n    } catch (error) {\n      if (isOperationCancelledError(error)) throw error;\n      throw new Error('Writer project original PDF could not be parsed.');\n    }",
              'PDF parse normalization',
            ),
            (
              "  if (\n    registered.operationId !== operation.operationId ||",
              "  if (\n    registered.operation !== operation ||\n    registered.operationId !== operation.operationId ||",
              'operation identity',
            ),
            (
              "  for (const element of elements) {\n    if (!element.assetIds) continue;",
              "  for (const element of elements) {\n    if (element.assetIds === undefined) continue;\n    if (!Array.isArray(element.assetIds)) {\n      throw new Error(`Writer element ${element.id} contains malformed asset references.`);\n    }",
              'asset reference shape',
            ),
          ]

          for old, new, label in replacements:
            if old not in text:
              raise SystemExit(f'{label} target not found')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm -f .github/workflows/phase3a1-final-hardening.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Phase 3A.1 staged import validation"
          git push origin HEAD:agent/atomic-writer-project-import-phase3a1
