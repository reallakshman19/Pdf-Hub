name: Phase 3B.3B apply TypeScript cleanup

on:
  push:
    branches:
      - agent/bounded-json-source-admission-phase3b3b

permissions:
  contents: write

concurrency:
  group: phase3b3b-type-cleanup
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-json-source-admission-phase3b3b
          fetch-depth: 0
      - name: Remove unused focused-test type import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/core/admission/zip/writerProjectJsonSourceAdmission.test.ts')
          text = path.read_text()
          needle = "  type WriterProjectJsonSourcePath,\n"
          if text.count(needle) != 1:
              raise SystemExit('expected one unused type import')
          path.write_text(text.replace(needle, ''))
          PY
          rm -f .github/workflows/phase3b3b-focused.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/core/admission/zip/writerProjectJsonSourceAdmission.test.ts .github/workflows/phase3b3b-focused.yml
          git commit -m 'Fix Phase 3B.3B strict TypeScript'
          git push origin HEAD:agent/bounded-json-source-admission-phase3b3b
