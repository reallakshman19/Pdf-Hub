name: Phase 3B.3B focused validation

on:
  push:
    branches:
      - agent/bounded-json-source-admission-phase3b3b
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase3b3b-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-json-source-admission-phase3b3b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Focused Phase 3B.3B tests
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/core/admission/zip/writerProjectJsonSourcePolicy.test.ts
          src/core/admission/zip/writerProjectJsonSourceAdmission.test.ts
          src/core/admission/zip/writerProjectJsonSourceCancellation.test.ts
          src/core/admission/zip/writerProjectJsonSourceSet.test.ts
          src/core/writer-v2/export/projectImportJsonSourceAdmission.test.ts
          src/core/writer-v2/export/projectImportMemberAdmission.test.ts
          src/core/writer-v2/export/projectImportResourceAdmission.test.ts
          src/core/writer-v2/export/projectZip.test.ts
          src/core/ocr/__tests__/ocrProjectCodec.test.ts
          src/core/ocr/__tests__/ocrProjectJsonSourceReader.test.ts
          --pool=forks --maxWorkers=1
      - name: Strict TypeScript
        working-directory: frontend
        run: pnpm run typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      - name: Remove temporary focused workflow
        run: |
          rm -f .github/workflows/phase3b3b-focused.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3b3b-focused.yml
          git commit -m 'Remove Phase 3B.3B focused workflow'
          git push origin HEAD:agent/bounded-json-source-admission-phase3b3b
