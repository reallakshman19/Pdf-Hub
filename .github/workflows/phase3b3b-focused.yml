name: Phase 3B.3B focused validation

on:
  push:
    branches:
      - agent/bounded-json-source-admission-phase3b3b
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase3b3b-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-diagnostic:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-json-source-admission-phase3b3b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Capture strict TypeScript diagnostics
        working-directory: frontend
        run: |
          set +e
          pnpm run typecheck > phase3b3b-typecheck.log 2>&1
          status=$?
          cat phase3b3b-typecheck.log
          exit $status
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b3b-typecheck-diagnostic
          path: frontend/phase3b3b-typecheck.log
