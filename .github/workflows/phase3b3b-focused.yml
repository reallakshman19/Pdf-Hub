name: Phase 3B.3B focused validation

on:
  push:
    branches:
      - agent/bounded-json-source-admission-phase3b3b
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase3b3b-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-diagnostic:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-json-source-admission-phase3b3b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Capture focused test diagnostics
        working-directory: frontend
        run: |
          set +e
          pnpm exec vitest run \
            src/core/admission/zip/writerProjectJsonSourcePolicy.test.ts \
            src/core/admission/zip/writerProjectJsonSourceAdmission.test.ts \
            src/core/admission/zip/writerProjectJsonSourceSet.test.ts \
            src/core/writer-v2/export/projectImportJsonSourceAdmission.test.ts \
            src/core/writer-v2/export/projectImportMemberAdmission.test.ts \
            src/core/writer-v2/export/projectImportResourceAdmission.test.ts \
            src/core/writer-v2/export/projectZip.test.ts \
            src/core/ocr/__tests__/ocrProjectCodec.test.ts \
            src/core/ocr/__tests__/ocrProjectJsonSourceReader.test.ts \
            --pool=forks --maxWorkers=1 > phase3b3b-focused.log 2>&1
          status=$?
          cat phase3b3b-focused.log
          exit $status
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b3b-focused-diagnostic
          path: frontend/phase3b3b-focused.log
