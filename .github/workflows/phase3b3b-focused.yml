name: Phase 3B.3B apply cancellation assertion

on:
  push:
    branches:
      - agent/bounded-json-source-admission-phase3b3b

permissions:
  contents: write

concurrency:
  group: phase3b3b-assertion-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-json-source-admission-phase3b3b
          fetch-depth: 0
      - name: Align controller cancellation message assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/core/writer-v2/export/projectImportJsonSourceAdmission.test.ts')
          text = path.read_text()
          old = ").rejects.toThrow('cancel after JSON source-set registration');"
          new = ").rejects.toThrow(\n      'Operation cancelled while running standalone Writer project after JSON source admission.',\n    );"
          if text.count(old) != 1:
              raise SystemExit('expected one cancellation assertion')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/phase3b3b-focused.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/core/writer-v2/export/projectImportJsonSourceAdmission.test.ts .github/workflows/phase3b3b-focused.yml
          git commit -m 'Fix Phase 3B.3B cancellation assertion'
          git push origin HEAD:agent/bounded-json-source-admission-phase3b3b
