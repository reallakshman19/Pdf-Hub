name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The locked Playwright version does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.23.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Shared foundation regression gate
        run: pnpm -C frontend exec vitest run src/core/cancellation src/core/document-source src/core/revision-store src/core/document-history src/core/document-evidence src/core/admission src/core/session src/core/commands src/core/pages src/adapters/document-source src/adapters/revision-store src/adapters/history-journal src/adapters/pdf-renderer src/core/annotations/store.durableHistory.test.ts --pool=forks --maxWorkers=1
      - name: Build
        env:
          VITE_BASE_PATH: /Pdf-Hub/
        run: pnpm -C frontend run build
      - name: Verify production artifact
        run: node frontend/scripts/verify-pages-artifact.mjs frontend/dist /Pdf-Hub/
      - name: Install Chromium for production smoke
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Smoke-test compiled application
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C frontend exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/pdf-hub-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/Pdf-Hub/ > /dev/null
          node frontend/scripts/smoke-pages-build.mjs http://127.0.0.1:4173/Pdf-Hub/
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173/Pdf-Hub/ pnpm -C frontend exec playwright test e2e/pdf-annotation-roundtrip.spec.ts --retries=0 --reporter=line
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
