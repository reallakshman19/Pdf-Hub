name: Phase 3B.1 focused test corrections
on:
  push:
    branches:
      - agent/raw-zip-structural-admission-phase3b1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-zip-structural-admission-phase3b1
          fetch-depth: 0
      - name: Correct duplicate message and non-ZIP64 ratio fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          inventory_path = Path('frontend/src/core/admission/zip/zipInventory.ts')
          inventory = inventory_path.read_text()
          old = """    const ordinals = group.map((entry) => entry.ordinal);
              const message = collisionMessage(kind, key);
              addCollision(state, kind, key, ordinals, message);
          """
          new = """    const ordinals = group.map((entry) => entry.ordinal);
              const displayKey = kind === 'EXACT_RAW_NAME'
                ? group[0]?.decodedFilename ?? key
                : key;
              const message = collisionMessage(kind, displayKey);
              addCollision(state, kind, key, ordinals, message);
          """
          if old not in inventory:
              raise SystemExit('collision message target not found')
          inventory_path.write_text(inventory.replace(old, new, 1))

          test_path = Path('frontend/src/core/admission/zip/zipInventory.test.ts')
          test = test_path.read_text()
          test = test.replace('uncompressedSize: 0xffffffff,', 'uncompressedSize: 0xfffffffe,', 1)
          test = test.replace('localUncompressedSize: 0xffffffff,', 'localUncompressedSize: 0xfffffffe,', 1)
          test = test.replace(
              'expect(inventory.measurements.MAX_DECLARED_COMPRESSION_RATIO).toBe(0xffffffff);',
              'expect(inventory.measurements.MAX_DECLARED_COMPRESSION_RATIO).toBe(0xfffffffe);',
              1,
          )
          test_path.write_text(test)
          PY
          rm .github/workflows/phase3b1-test-diagnostics.yml
          rm .github/workflows/phase3b1-test-fix.yml
      - name: Commit focused test corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 3B.1 duplicate diagnostics and ratio fixture"
          git push origin HEAD:agent/raw-zip-structural-admission-phase3b1
