name: agent-publish-optional-abort-args

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-publish-optional-abort-args
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'agent/pdf-operation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pdf-operation-cancellation
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: agent-optional-abort-args-source
          path: /tmp/agent-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: reallaksh19/Pdf-Hub
          run-id: 30106967604
      - name: Publish validated source and remove diagnostics
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-extract
          tar -xzf /tmp/agent-source/optional-abort-args-source.tar.gz -C /tmp/agent-extract
          cp /tmp/agent-extract/frontend/src/core/macro/steps/page-ops.ts frontend/src/core/macro/steps/page-ops.ts
          cp /tmp/agent-extract/frontend/src/core/macro/steps/document-ops.ts frontend/src/core/macro/steps/document-ops.ts
          rm -f \
            .github/workflows/agent-apply-optional-abort-args.yml \
            .github/workflows/agent-full-test-diagnostics.yml \
            .github/workflows/agent-package-optional-abort-args.yml \
            .github/workflows/agent-publish-optional-abort-args.yml \
            scripts/agent_fix_optional_abort_args.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/core/macro/steps/page-ops.ts frontend/src/core/macro/steps/document-ops.ts .github/workflows scripts
          git diff --cached --quiet && { echo 'No changes to publish'; exit 1; }
          git commit -m "Preserve adapter call compatibility without abort signals"
          git push origin HEAD:agent/pdf-operation-cancellation
