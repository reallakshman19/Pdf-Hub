name: agent-render-scheduling-integration

on:
  push:
    branches:
      - agent/render-scheduling-memory-budgets
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-scheduling-memory-budgets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply render scheduling integration
        run: |
          python scripts/agent_apply_render_scheduling.py
          python scripts/agent_fix_render_typecheck.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: cd frontend && pnpm install --no-frozen-lockfile
      - name: Strict TypeScript
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          cd frontend
          pnpm run typecheck > ../render-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: render-typecheck-diagnostics
          path: render-typecheck.log
      - name: Stop after TypeScript failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Render scheduling regressions
        run: >-
          cd frontend && pnpm exec vitest run
          src/core/renderer/renderScheduler.test.ts
          src/core/renderer/renderResourceCache.test.ts
          src/adapters/pdf-renderer/PdfRendererAdapter.test.ts
          --pool=forks --maxWorkers=1
      - name: Complete Vitest suite
        run: cd frontend && pnpm exec vitest run --pool=forks
      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/adapters/pdf-renderer/PdfRendererAdapter.ts \
            frontend/src/components/sidebar/panels/ThumbnailSidebar.tsx \
            frontend/src/core/renderer/renderScheduler.ts \
            frontend/src/core/renderer/renderScheduler.test.ts \
            frontend/src/core/renderer/renderResourceCache.ts
          git commit -m "Integrate scheduled thumbnail rendering"
          git push origin HEAD:agent/render-scheduling-memory-budgets
