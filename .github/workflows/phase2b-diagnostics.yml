name: Phase 2B fix bootstrap

on:
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/batch-pdf-admission-phase2b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.23.0 --activate
      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('frontend/src/core/macro/batchRunner.test.ts')
          test_source = test_path.read_text()
          marker = """function successResult(outputSize = 16, logs: string[] = []): MacroExecutionResult {"""
          helper = """function toArrayBuffer(bytes: Uint8Array): ArrayBuffer {
            const copy = new Uint8Array(bytes.byteLength);
            copy.set(bytes);
            return copy.buffer;
          }

          function successResult(outputSize = 16, logs: string[] = []): MacroExecutionResult {"""
          if marker not in test_source:
              raise SystemExit('batchRunner.test.ts helper insertion marker missing')
          test_source = test_source.replace(marker, helper, 1)
          if "new File([bytes], name" not in test_source:
              raise SystemExit('batchRunner.test.ts File marker missing')
          test_source = test_source.replace("new File([bytes], name", "new File([toArrayBuffer(bytes)], name", 1)
          buffer_occurrences = test_source.count('pdfBytes().buffer')
          if buffer_occurrences != 3:
              raise SystemExit(f'expected 3 pdfBytes().buffer occurrences, found {buffer_occurrences}')
          test_source = test_source.replace('pdfBytes().buffer', 'toArrayBuffer(pdfBytes())')
          test_path.write_text(test_source)

          runner_path = Path('frontend/src/core/macro/batchRunner.ts')
          runner_source = runner_path.read_text()
          old = """  return Object.freeze({
              ...record,
              logs: Object.freeze([...record.logs]),
            }) as T;"""
          new = """  return Object.freeze({
              ...record,
              logs: Object.freeze([...record.logs]),
            }) as unknown as T;"""
          if old not in runner_source:
              raise SystemExit('batchRunner.ts freezeRecord marker missing')
          runner_path.write_text(runner_source.replace(old, new, 1))
          PY
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Verify focused fix
        working-directory: frontend
        run: |
          pnpm run typecheck
          pnpm exec vitest run src/core/macro/batchRunner.test.ts src/core/admission/batchEntrypoints.test.ts
      - name: Remove bootstrap and push fix
        shell: bash
        run: |
          rm .github/workflows/phase2b-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/core/macro/batchRunner.ts frontend/src/core/macro/batchRunner.test.ts .github/workflows/phase2b-diagnostics.yml
          git commit -m "Fix Phase 2B strict TypeScript certification"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
